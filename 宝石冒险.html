<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234d43">
<title>宝石冒险</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f8fbef;letter-spacing:0}
  body{margin:0;background:#132d2b;overflow:hidden;overscroll-behavior:none}
  button,a{-webkit-touch-callout:none;touch-action:none;user-select:none;font:inherit}
  button{cursor:pointer}
  #app{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .stage{position:relative;width:min(100vw,177.7778vh);width:min(100vw,177.7778dvh);aspect-ratio:16/9;overflow:hidden;background:#9bd5b6;isolation:isolate}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .top{position:absolute;inset:14px 18px auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
  .brand,.stats,.tools{display:flex;align-items:center;gap:10px}
  .brand{gap:12px}.brand strong{display:block;font-size:21px;text-shadow:0 2px 2px #163b3a}
  .brand small{font-size:12px;color:#efffe3;text-shadow:0 1px 2px #163b3a}
  .hud{background:#163b37e8;border:1px solid #e1f3cf5c;box-shadow:0 3px 0 #142f3640;border-radius:8px;padding:9px 13px}
  .stats{font-size:16px;font-weight:750;gap:14px}.stat{white-space:nowrap}.stat small{display:block;font-weight:500;font-size:11px;color:#d3e6ce}
  #hearts{color:#ff9f9a;font-size:19px;letter-spacing:0;line-height:1.2}
  .icon{width:42px;height:42px;display:grid;place-items:center;border-radius:8px;border:1px solid #e1f3cf70;background:#163b37e8;color:#fff9e9;text-decoration:none;font-size:22px;pointer-events:auto}
  .icon:hover,.icon:focus-visible{background:#39705d;outline:2px solid #f7dc92}
  .controls{position:absolute;inset:auto 22px 15px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
  .pad,.actions{display:flex;gap:12px;align-items:flex-end;pointer-events:none}
  .control{pointer-events:auto;width:70px;height:66px;border:2px solid #fffbd0a8;border-radius:18px;background:#213b4bc9;color:#fff8df;box-shadow:0 5px 0 #102b3ba6,inset 0 2px 0 #ffffff32;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;touch-action:none}
  .control .symbol{font-size:26px;font-weight:800;line-height:1}.control small{font-size:12px}
  .control.jump{background:#efc974e8;color:#3f462a;width:82px;height:80px}
  .control.orb{background:#77cde1e8;color:#183e51}
  .control.attack{background:#f6a087e8;color:#653d38}
  .control.release{width:59px;height:56px}
  .control.pressed{transform:translateY(4px);box-shadow:0 1px 0 #102b3ba6}
  .control:disabled{opacity:.45;cursor:default}
  #gate{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);border:2px solid #fff4bc;background:#203d4ce8;color:#fff6d2;border-radius:8px;min-height:48px;padding:9px 22px;font-weight:800;max-width:75%}
  #gate[hidden],#bossHud[hidden],#notice[hidden]{display:none}
  #bossHud{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:min(430px,64%);text-align:center}
  #bossHud b{font-size:13px;color:#fff7cf;text-shadow:0 2px 2px #25314a}
  #bossCells{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin-top:5px;background:#202b44;padding:5px;border:1px solid #edebc4;border-radius:5px}
  #bossCells i{height:10px;background:#82e1e5;border-radius:1px}#bossCells i.empty{background:#455060}
  #notice{position:absolute;top:97px;left:50%;transform:translateX(-50%);padding:8px 15px;background:#163b37e8;border-radius:7px;font-size:14px;pointer-events:none;max-width:80%;text-align:center}
  .veil{position:absolute;inset:0;background:#102a39a8;display:grid;place-items:center;padding:18px;z-index:5}.veil[hidden]{display:none}
  .dialog{width:min(440px,100%);max-height:100%;overflow:auto;background:#fff9ec;color:#28474d;border:3px solid #e8cf91;border-radius:8px;padding:25px;text-align:center;box-shadow:0 10px 0 #14293866}
  .dialog h2{font-size:27px;margin:0 0 12px}.dialog p{line-height:1.7;margin:10px 0 18px}
  .dialog button,.dialog a{min-height:46px;padding:10px 15px;border:1px solid #99afa4;background:#e4ecdf;color:#294b47;border-radius:6px;font-size:16px;font-weight:750;text-decoration:none;display:inline-block;margin:4px}
  .dialog .primary{background:#f1cb78;border-color:#cbac62}
  .save-warning{position:absolute;bottom:90px;left:16px;color:#fff6c7;font-size:12px}
  @media(max-width:850px){.top{inset:8px 10px auto;gap:7px}.brand strong{font-size:16px}.brand small{font-size:10px}.brand{gap:7px}.hud{padding:6px 8px}.stats{gap:9px;font-size:14px}.icon{width:34px;height:34px;font-size:19px}.tools{gap:5px}#hearts{font-size:16px}.control{width:60px;height:56px}.control.jump{width:72px;height:68px}.control.release{width:50px;height:48px}.controls{inset:auto 14px 12px}.pad,.actions{gap:8px}#bossHud{top:65px}#gate{bottom:93px}}
  @media(max-width:600px){.brand strong{font-size:14px}.brand small{display:none}.stats{font-size:11px;gap:7px}.stat small{font-size:9px}#hearts{font-size:12px;letter-spacing:0}.icon{width:28px;height:28px;font-size:15px}.top{inset:6px}.hud{padding:4px 6px}.control{width:43px;height:42px;border-radius:11px}.control.jump{width:49px;height:48px}.control.release{width:40px;height:38px}.control .symbol{font-size:19px}.control small{font-size:10px}.controls{inset:auto 9px 7px}.pad,.actions{gap:6px}#bossHud{top:47px}#bossCells i{height:5px}#gate{bottom:65px;min-height:32px;padding:5px 12px;font-size:12px}#notice{top:55px;font-size:11px}.dialog{padding:12px}.dialog h2{font-size:21px}.dialog p{font-size:13px}}
</style>
</head>
<body>
<main id="app">
  <div class="stage">
    <canvas id="game" width="1280" height="720" aria-label="宝石冒险游戏地图"></canvas>
    <header class="top">
      <div class="brand"><a class="icon" href="index.html" aria-label="返回游戏大厅" title="返回游戏大厅">⌂</a><div><strong>宝石冒险</strong><small id="worldLabel"></small></div></div>
      <div class="stats hud">
        <div class="stat"><div id="hearts" aria-label="生命值"></div><small id="playerLabel"></small></div>
        <div class="stat"><span style="color:#88ece4">◆</span> <span id="gemCount">0 / 27</span><small id="localCount"></small></div>
        <div class="stat"><span id="formName">绒芽</span><small>当前形态</small></div>
      </div>
      <div class="tools"><button class="icon" id="soundBtn" aria-label="开启声音" title="开启声音">♪</button><button class="icon" id="pauseBtn" aria-label="暂停" title="暂停">Ⅱ</button></div>
    </header>
    <div id="bossHud" hidden><b>水晶巨龟</b><div id="bossCells"></div></div>
    <div id="notice" role="status" hidden></div>
    <div id="storageWarning" class="save-warning" role="status"></div>
    <button id="gate" hidden></button>
    <nav class="controls" aria-label="游戏操作">
      <div class="pad"><button class="control" data-control="left" aria-label="向左" title="A / 左方向键"><span class="symbol">◀</span></button><button class="control" data-control="right" aria-label="向右" title="D / 右方向键"><span class="symbol">▶</span></button></div>
      <div class="actions">
        <button class="control release" data-control="release" aria-label="解除变身" title="L"><span class="symbol">↶</span><small>解除</small></button>
        <button class="control orb" data-control="orb" aria-label="变身光球" title="K"><span class="symbol">✦</span><small>光球</small></button>
        <button class="control attack" data-control="attack" aria-label="攻击" title="J"><span class="symbol">✧</span><small>攻击</small></button>
        <button class="control jump" data-control="jump" aria-label="跳跃" title="空格 / 再按一次二段跳"><span class="symbol">↑</span><small>跳跃</small></button>
      </div>
    </nav>
    <div class="veil" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalActions"></div></section></div>
  </div>
</main>
<script src="vendor/matter-0.20.0.min.js"></script>
<script>
(() => {
  "use strict";
  const $=s=>document.querySelector(s);
  if(!window.Matter){$("#storageWarning").textContent="物理引擎未加载，请刷新页面。";return}
  const {Engine,Bodies,Body,Composite}=Matter;
  const W=1280,H=720,FLOOR=565,STEP=1000/60;
  const TYPES=["fire","ice","water","lightning","sword","blade"];
  const FORMS={
    normal:{name:"绒芽",color:"#b57850"},fire:{name:"烈火",color:"#ef7058"},ice:{name:"寒冰",color:"#8ce0e8"},
    water:{name:"清水",color:"#5cafe3"},lightning:{name:"雷电",color:"#ab87dd"},sword:{name:"利剑",color:"#afbac5"},blade:{name:"弯刀",color:"#e7be58"}
  };
  const WORLDS=[
    {name:"晨露森林",width:5400,sky:["#a0d9ce","#e9efb5"],land:"#8eac63",edge:"#376f55",stone:"#b0b987",
      platforms:[[640,455,230],[900,355,220],[1300,445,200],[1450,325,240],[1980,450,260],[2760,455,200],[2990,340,230],[3440,440,290],[4390,450,200],[4660,335,240]],
      gems:[[420,532,0],[1010,321,1],[1550,291,1],[2050,416,0],[2450,532,1],[3080,306,1],[3550,406,0],[4090,532,1],[4770,301,1]]},
    {name:"回声水晶洞",width:5400,sky:["#292d5b","#5b6391"],land:"#716a99",edge:"#b0a6cb",stone:"#676d94",
      platforms:[[520,445,260],[840,340,230],[1310,450,200],[1510,330,260],[1980,465,260],[2640,450,250],[2940,340,300],[3470,435,280],[4290,455,270],[4650,330,230]],
      gems:[[360,532,0],[950,306,1],[1630,296,1],[2070,431,0],[2430,532,1],[3080,306,1],[3570,401,0],[4060,532,1],[4750,296,1]]},
    {name:"星屿宇宙",width:5400,sky:["#172b50","#565281"],land:"#69718c",edge:"#b7bbc7",stone:"#7983a2",
      platforms:[[650,455,220],[940,350,230],[1390,445,220],[1650,330,240],[2170,450,220],[2790,445,240],[3110,335,230],[3520,445,260],[4420,440,200],[4700,330,240]],
      gems:[[410,532,0],[1050,316,1],[1760,296,1],[2260,416,0],[2550,532,1],[3220,301,1],[3620,411,0],[4110,532,1],[4820,296,1]]},
    {name:"水晶圣所",width:1800,sky:["#273653","#726b96"],land:"#879aab",edge:"#d1d9d7",stone:"#849fb3",platforms:[],gems:[]}
  ];
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const overlap=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;
  const fresh=()=>({version:1,world:0,x:180,y:520,form:"normal",gems:[[],[],[]],won:false});
  let playerName="爸爸";
  try{playerName=localStorage.getItem("familyPlayer")?.trim()||"爸爸"}catch{}
  const SAVE_KEY="gemAdventureV1:"+playerName;
  function readSave(){
    try{
      const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(!raw||raw.version!==1)return fresh();
      const s=fresh();s.world=Number.isInteger(raw.world)&&raw.world>=0&&raw.world<=3?raw.world:0;
      s.x=Number.isFinite(raw.x)?clamp(raw.x,100,WORLDS[s.world].width-100):180;
      s.y=Number.isFinite(raw.y)?clamp(raw.y,120,520):520;s.form=FORMS[raw.form]?raw.form:"normal";
      s.gems=[0,1,2].map(i=>[...new Set((Array.isArray(raw.gems?.[i])?raw.gems[i]:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<9))]);
      s.won=raw.won===true&&s.gems.flat().length===27;return s;
    }catch{return fresh()}
  }
  class Adventure{
    constructor(saved=readSave()){
      this.saveData=saved;this.world=saved.world;this.form=saved.form;this.hp=6;this.camera=0;this.time=0;this.jumps=0;
      this.facing=1;this.attackReady=0;this.kick=0;this.hurtTime=0;this.effects=[];this.shots=[];this.orb=null;this.paused=false;
      this.transition=0;this.flash=0;this.mode="play";this.contacts=new Set();this.entryX=180;this.inputs={left:false,right:false};
      this.setWorld(this.world,"load");
    }
    get p(){return {x:this.body.position.x,y:this.body.position.y,w:42,h:44}}
    get total(){return this.saveData.gems.reduce((n,a)=>n+a.length,0)}
    save(){
      this.saveData.world=this.world;this.saveData.x=this.p.x;this.saveData.y=this.p.y;this.saveData.form=this.form;
      try{localStorage.setItem(SAVE_KEY,JSON.stringify(this.saveData));$("#storageWarning").textContent=""}
      catch{$("#storageWarning").textContent="无法保存到浏览器；当前游戏仍可继续。"}
    }
    setWorld(id,arrival="left"){
      this.sceneRevision=(this.sceneRevision||0)+1;
      this.world=id;this.map=WORLDS[id];this.entryX=arrival==="right"?this.map.width-180:180;
      this.engine=Engine.create({gravity:{x:0,y:2.2},positionIterations:8,velocityIterations:8});
      const rect=(x,y,w,h)=>Bodies.rectangle(x+w/2,y+h/2,w,h,{isStatic:true,friction:0,restitution:0});
      this.solids=[rect(0,FLOOR,this.map.width,200),rect(-40,0,40,800),rect(this.map.width,0,40,800),...this.map.platforms.map(([x,y,w])=>rect(x,y,w,22))];
      const x=arrival==="load"?this.saveData.x:this.entryX,y=arrival==="load"?this.saveData.y:520;
      this.body=Bodies.rectangle(x,y,42,44,{inertia:Infinity,friction:0,frictionStatic:0,frictionAir:0,restitution:0,slop:.02});
      Composite.add(this.engine.world,[...this.solids,this.body]);
      // A saved mid-jump position can overlap a platform after a browser closes.
      for(const [px,py,pw]of this.map.platforms)if(x+21>px&&x-21<px+pw&&y+22>py&&y-22<py+22)Body.setPosition(this.body,{x,y:py-23});
      this.enemies=[];this.shots=[];this.effects=[];this.contacts.clear();this.orb=null;this.jumps=0;this.grounded=false;this.kick=0;this.attackReady=0;
      if(id<3){
        const specials=[700,1200,1830,2680,3360,3950,4560,5020];
        specials.forEach((x,i)=>this.enemies.push({id:"s"+i,x,y:FLOOR-25,w:46,h:48,type:TYPES[(i+id*2)%6],hp:2,active:true,cd:1.8+i*.33,frozen:0,anim:0,dir:-1}));
        [550,1400,2310,2880,3800,4380].forEach((x,i)=>this.enemies.push({id:"r"+i,x,y:FLOOR-22,w:42,h:42,type:"roll",hp:1,active:true,cd:0,frozen:0,anim:0,home:x}));
      }
      this.boss=null;this.summon=0;this.victory=0;this.mode="play";
      if(id===3&&this.total===27&&!this.saveData.won){this.mode="summon";this.summon=0}
      this.camera=clamp(this.p.x-W*.4,0,this.map.width-W);this.transition=.55;this.save();this.updateHud();
    }
    gateTarget(){
      if(Math.abs(this.p.y-(FLOOR-22))>66)return null;
      if(this.world>0&&this.p.x<155)return {id:this.world-1,arrival:"right"};
      if(this.world<3&&this.p.x>this.map.width-155)return {id:this.world+1,arrival:"left"};
      return null;
    }
    enter(){
      if(this.paused||this.transition>0||this.mode!=="play")return;
      const target=this.gateTarget();if(!target)return;
      this.setWorld(target.id,target.arrival);tone(360,.14);
    }
    jump(){
      if(this.paused||this.mode!=="play"||this.jumps>=2)return false;
      this.jumps++;this.grounded=false;Body.setVelocity(this.body,{x:this.body.velocity.x,y:-12.5});
      this.burst(this.p.x,this.p.y+24,this.jumps===2?"#c4f6ea":"#f5f1cc",this.jumps===2?16:7);tone(this.jumps===2?620:440,.07);return true;
    }
    absorb(){
      if(this.paused||this.mode!=="play"||this.form!=="normal"||this.orb)return false;
      const candidates=this.enemies.filter(e=>e.active&&e.hp>0&&e.type!=="roll");
      candidates.sort((a,b)=>dist(this.p,a)-dist(this.p,b));
      if(!candidates.length)return false;
      this.orb={x:this.p.x,y:this.p.y-55,target:candidates[0],age:0};tone(720,.18);return true;
    }
    release(){
      if(this.paused||this.mode!=="play"||this.form==="normal")return;
      this.form="normal";this.flash=.4;this.burst(this.p.x,this.p.y,"#f1eed0",22);this.save();this.updateHud();
    }
    attack(){
      if(this.paused||this.mode!=="play"||this.form==="normal"||this.time<this.attackReady)return false;
      this.attackReady=this.time+(this.form==="blade"?1.25:.42);this.attackAnim=.24;
      this.fire(this.form,this.p.x,this.p.y,this.facing,"player");tone(210,.06);return true;
    }
    fire(type,x,y,dir,owner){
      const melee=type==="sword"||type==="lightning";
      this.shots.push({type,x:x+dir*28,y,origin:x,dir,owner,vx:dir*(type==="water"?460:370),vy:0,age:0,life:melee?.2:3,leg:0,hits:new Set(),melee});
    }
    burst(x,y,color,count=12){
      for(let i=0;i<count;i++){const a=i/count*Math.PI*2;this.effects.push({x,y,vx:Math.cos(a)*(50+Math.random()*130),vy:Math.sin(a)*(50+Math.random()*130),life:.5+Math.random()*.45,max:1,color,size:3+Math.random()*4})}
    }
    damageEnemy(e,shot){
      if(!e.active)return;
      e.hp--;e.anim=.2;
      if(shot.type==="ice"){e.frozen=1.1;e.pendingDeath=e.hp<=0}
      else if(e.hp<=0){e.active=false;this.burst(e.x,e.y,FORMS[e.type]?.color||"#f5cd7e")}
    }
    hurt(source){
      if(this.mode!=="play")return;
      this.hp--;this.hurtTime=.22;const dir=this.p.x<source.x?-1:1;this.kick=dir*8;
      // Separate the contact pair, not a timed invulnerability window.
      if(source.w)Body.setPosition(this.body,{x:clamp(source.x+dir*((source.w+42)/2+7),24,this.map.width-24),y:this.p.y});
      Body.setVelocity(this.body,{x:this.kick,y:-6});this.burst(this.p.x,this.p.y,"#fff2bc",7);tone(130,.12);
      if(this.hp<=0)this.respawn();this.updateHud();
    }
    respawn(){
      this.hp=6;
      if(this.world===3)this.setWorld(2,"left");
      else this.setWorld(this.world,this.entryX>this.map.width/2?"right":"left");
      notify("重新出发！");this.save();
    }
    hitBoss(shot,box){
      const b=this.boss;if(!b||b.hp<=0)return false;
      const shield={x:b.x+b.dir*112,y:b.y-25,w:25,h:190};
      if(b.shield>0&&overlap(box,shield)){
        if(!shot.hits.has("shield")){shot.hits.add("shield");b.shieldHits++;this.burst(shield.x,box.y,"#c4f4ff",6);if(b.shieldHits>=3){b.shield=0;this.burst(shield.x,shield.y,"#baefff",28)}}
        return "shield";
      }
      if(overlap(box,{x:b.x,y:b.y-17,w:174,h:150})){
        if(!shot.hits.has("boss")){shot.hits.add("boss");b.hp--;b.hurt=.18;this.burst(box.x,box.y,"#e6c9fa",9);tone(290,.06);if(b.hp<=0){this.mode="victory";this.victory=0;this.saveData.won=true;this.shots=[];this.burst(b.x,b.y-40,"#d3ffff",65);this.save()}}
        return "boss";
      }
      return false;
    }
    updateShots(dt){
      const revision=this.sceneRevision;
      const shots=this.shots.slice();
      for(const s of shots){
        if(s.dead)continue;s.age+=dt;
        if(s.type==="blade"){
          const leg=s.age>=.7?1:0;if(leg!==s.leg){s.leg=leg;s.hits.clear()}
          s.x+=s.dir*(s.leg?-1:1)*390*dt;if(s.age>=1.4)s.dead=true;
        }else if(!s.melee){s.x+=s.vx*dt;s.y+=s.vy*dt}
        const reach=s.type==="lightning"?155:88;
        const box=s.melee?{x:s.origin+s.dir*(reach/2+20),y:s.y,w:reach,h:65}:{x:s.x,y:s.y,w:s.type==="crystal"?25:24,h:25};
        if(s.owner==="player"){
          const blocked=this.hitBoss(s,box);
          if(blocked&&!s.melee&&s.type!=="blade")s.dead=true;
          if(blocked==="shield"&&s.type==="blade"&&s.leg===0){s.age=.7;s.leg=1}
          if(!blocked)for(const e of this.enemies)if(e.active&&!s.hits.has(e.id)&&overlap(box,e)){
            s.hits.add(e.id);this.damageEnemy(e,s);if(!s.melee&&s.type!=="blade"){s.dead=true;break}
          }

    path([[-68,4],[-40,19],[0,24],[47,17],[73,0],[70,22],[0,37],[-69,24]],"#b9dbe0","#e4f6e8");
    ellipse(-86,5,34,29,"#8bb9bc");path([[-111,-8],[-94,-22],[-72,-9]],"#b0d8cb");
    ellipse(-99,-2,5,7,"#203f58");ellipse(-101,-4,2,2,"#fff");line([[-113,15],[-99,19],[-89,15]],"#4c7b83",3);
    g.restore();
    if(b.shield>0){
      const x=b.x+b.dir*112,y=b.y-25;
      g.globalAlpha=.7+Math.sin(time*6)*.12;path([[x,y-100],[x+22,y-72],[x+22,y+70],[x,y+94],[x-22,y+70],[x-22,y-72]],"#8ed9f0","#e0ffff");
      for(let i=0;i<b.shieldHits;i++)line([[x-13,y-55+i*50],[x+8,y-36+i*50],[x-8,y-18+i*50]],"#fff",3);g.globalAlpha=1;
    }
  }
  function drawShot(s){
    const c=FORMS[s.type]?.color||"#b3cff3";g.save();
    if(s.melee){
      const r=s.type==="lightning"?155:88;
      if(s.type==="lightning"){const pts=[];for(let i=0;i<9;i++)pts.push([s.origin+s.dir*(20+i*r/8),s.y+(i%2?9:-9)]);line(pts,"#f7e8ad",5);line(pts,"#fffbd8",2)}
      else{g.translate(s.origin,s.y);g.scale(s.dir,1);g.beginPath();g.arc(10,0,83,-.7,.7);g.strokeStyle="#fff8cf";g.lineWidth=12;g.stroke()}
    }else if(s.type==="blade"){
      g.translate(s.x,s.y);g.rotate(s.age*17);g.beginPath();g.arc(0,0,19,0,Math.PI*1.5);g.arc(0,0,11,Math.PI*1.5,0,true);g.fillStyle="#ffe49f";g.fill();
    }else if(s.type==="crystal"||s.type==="ice"){gem(s.x,s.y,15,c)}
    else{ellipse(s.x,s.y,12,10,c);ellipse(s.x-s.dir*11,s.y,10,6,c+"88");ellipse(s.x+3,s.y-3,5,4,"#fff7c6")}
    g.restore();
  }
  function draw(game){
    background(game);g.save();g.translate(-game.camera,0);
    decorations(game);terrain(game);
    if(game.world>0)portal(95,WORLDS[game.world-1].name);
    if(game.world<3)portal(game.map.width-95,WORLDS[game.world+1].name);
    for(let i=0;i<game.map.gems.length;i++){const [x,y,hidden]=game.map.gems[i];if(!game.saveData.gems[game.world].includes(i)){gem(x,y+Math.sin(game.time*3+i)*3);if(hidden)coverGem(game,x,y)}}
    for(const e of game.enemies)if(e.active&&Math.abs(e.x-game.camera-W/2)<W/2+100){ellipse(e.x,e.y+26,25,5,"#16352f33");creature(e.type,e.x,e.y,e.dir||1,game.time,e.anim,false,e.frozen>0)}
    if(game.boss&&game.boss.hp>0)turtle(game.boss,game.time);
    const p=game.p;ellipse(p.x,p.y+26,29,5,"#173b3c36");
    if(game.form==="normal")animal(p.x,p.y,game.facing,game.time,Math.abs(game.body.velocity.x)>1,!game.grounded,game.hurtTime>0);
    else creature(game.form,p.x,p.y,game.facing,game.time,game.attackAnim,true);
    for(const s of game.shots)drawShot(s);
    if(game.orb){const o=game.orb;ellipse(o.x,o.y,23+Math.sin(game.time*15)*3,23,"#dafbf35c");ellipse(o.x,o.y,13,13,"#f4ffeb");star(o.x,o.y,8,"#8de2ec")}
    if(game.mode==="summon"){
      const t=game.summon/3.2,cx=1390,cy=310;
      for(let i=0;i<27;i++){const a=i/27*Math.PI*2+game.summon*2,r=135*(1-t)+20,x=p.x+(cx-p.x)*Math.min(t*3,1)+Math.cos(a)*r,y=p.y+(cy-p.y)*Math.min(t*3,1)+Math.sin(a)*r;gem(x,y,7+Math.sin(t*Math.PI)*4)}
      star(cx,cy,20+t*75,"#e1fff1");
    }
    for(const e of game.effects){g.globalAlpha=Math.min(1,e.life*2);star(e.x,e.y,e.size,e.color)}g.globalAlpha=1;
    decorations(game,true);g.restore();
    if(game.transition>0){g.fillStyle=`rgba(20,34,49,${game.transition*.6})`;g.fillRect(0,0,W,H)}
    if(game.flash>0){g.fillStyle=`rgba(236,255,235,${game.flash*.5})`;g.fillRect(0,0,W,H)}
    if(game.mode==="victory"){for(let i=0;i<35;i++)star((i*181)%W,80+((i*73+game.victory*80)%540),6+(i%4),"#fff1bd")}
  }
  let audio=null,sound=false;
  function tone(freq,duration){
    if(!sound||!audio)return;
    try{const o=audio.createOscillator(),v=audio.createGain();o.type="sine";o.frequency.setValueAtTime(freq,audio.currentTime);v.gain.setValueAtTime(.035,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}
  }
  let noticeTimer;
  function notify(text){$("#notice").textContent=text;$("#notice").hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$("#notice").hidden=true,1600)}
  function clearInputs(){game.inputs.left=false;game.inputs.right=false;held.clear();document.querySelectorAll(".pressed").forEach(b=>b.classList.remove("pressed"))}
  function showModal(title,text,label,action,secondary){
    clearInputs();game.paused=true;$("#modalTitle").textContent=title;$("#modalText").textContent=text;$("#modalActions").replaceChildren();
    const add=(name,fn,primary)=>{const b=document.createElement("button");b.textContent=name;if(primary)b.className="primary";b.onclick=fn;$("#modalActions").append(b)};
    add(label,action,true);if(secondary)add(secondary.label,secondary.action);$("#modal").hidden=false;$("#modalActions button").focus();
  }
    function closeModal(){$("#modal").hidden=true;game.paused=false;if(game.mode==="won")game.mode="play";$("#pauseBtn").focus()}
  function pause(){
    if(!$("#modal").hidden)return;
    showModal("休息一下",WORLDS[game.world].name,"继续冒险",closeModal,{label:"重新开始游戏",action:()=>{
      showModal("重新开始？","只清除当前玩家的《宝石冒险》进度，其他游戏和玩家不会受影响。","确认重新开始",()=>{
        game=new Adventure(fresh());game.save();closeModal();
      },{label:"取消",action:closeModal});
    }});
    game.save();
  }
  let game=new Adventure();
  const held=new Map(),keyMap={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"," ":"jump",j:"attack",J:"attack",k:"orb",K:"orb",l:"release",L:"release",ArrowUp:"enter",w:"enter",W:"enter",Enter:"enter"};
  function action(a){if(a==="jump")game.jump();if(a==="attack")game.attack();if(a==="orb")game.absorb();if(a==="release")game.release();if(a==="enter")game.enter()}
  function syncHeld(){game.inputs.left=[...held.values()].includes("left");game.inputs.right=[...held.values()].includes("right")}
  document.addEventListener("keydown",e=>{
    if(e.target.matches("input,textarea,select"))return;
    if(!$("#modal").hidden){if(e.key==="Escape"){e.preventDefault();closeModal()}return}
    if(e.key==="Escape"){pause();return}const a=keyMap[e.key];if(!a)return;e.preventDefault();
    if(!e.repeat){held.set("key:"+e.code,a);syncHeld();action(a)}
  });
  document.addEventListener("keyup",e=>{held.delete("key:"+e.code);syncHeld()});
  document.querySelectorAll("[data-control]").forEach(b=>{
    const a=b.dataset.control;
    b.addEventListener("pointerdown",e=>{e.preventDefault();if(b.disabled||game.paused)return;b.setPointerCapture(e.pointerId);held.set(e.pointerId,a);b.classList.add("pressed");syncHeld();action(a)});
    const release=e=>{held.delete(e.pointerId);syncHeld();if(![...held.values()].includes(a))b.classList.remove("pressed")};
    b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);b.addEventListener("lostpointercapture",release);
    b.addEventListener("contextmenu",e=>e.preventDefault());
  });
  $("#gate").onclick=()=>game.enter();$("#pauseBtn").onclick=pause;
  $("#soundBtn").onclick=()=>{
    sound=!sound;
    if(sound)try{audio??=new(window.AudioContext||window.webkitAudioContext)();Promise.resolve(audio.resume()).catch(()=>{})}catch{sound=false}
    $("#soundBtn").setAttribute("aria-label",sound?"关闭声音":"开启声音");$("#soundBtn").title=sound?"关闭声音":"开启声音";$("#soundBtn").style.opacity=sound?"1":".65";tone(660,.1);
  };
  window.addEventListener("blur",()=>{clearInputs();game.save()});
  document.addEventListener("visibilitychange",()=>{clearInputs();if(document.hidden){game.save();pause()}});
  window.addEventListener("pagehide",()=>game.save());window.addEventListener("beforeunload",()=>game.save());
  let last=0,acc=0,lastSave=0;
  function frame(now){
    const elapsed=last?Math.min((now-last)/1000,.1):0;last=now;acc+=elapsed;
    while(acc>=1/60){game.step();acc-=1/60}
    draw(game);if(now-lastSave>2000){game.save();lastSave=now}requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
