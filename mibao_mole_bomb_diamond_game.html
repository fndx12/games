<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米宝的地洞惊喜游戏</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #c7f0ff 0%, #fff5c9 100%);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .game-box {
      width: 760px;
      max-width: 95vw;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #ff6b6b;
      font-size: 34px;
    }

    .info-bar {
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      font-size: 24px;
      font-weight: bold;
      color: #444;
    }

    #status {
      color: #2f7d32;
    }

    .board {
      position: relative;
      padding: 24px;
      border: 4px solid #7f5539;
      border-radius: 24px;
      background: linear-gradient(180deg, #8fd694 0%, #67b26f 100%);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
    }

    .holes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .hole {
      position: relative;
      height: 150px;
      border-radius: 24px;
      background: linear-gradient(180deg, #9be7ff 0%, #d9f6ff 48%, #8b5a3c 49%, #5a3825 100%);
      overflow: hidden;
    }

    .pit {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 120px;
      height: 46px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #3a2417;
      box-shadow: inset 0 10px 14px rgba(0, 0, 0, 0.35);
    }

    .item {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%) translateY(100px);
      width: 84px;
      height: 84px;
      border: none;
      background: transparent;
      font-size: 54px;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: none;
    }

    .item.show {
      display: block;
      transform: translateX(-50%) translateY(0);
    }

    .item:disabled {
      cursor: default;
    }

    .message {
      min-height: 28px;
      margin-top: 14px;
      color: #5d4037;
      font-size: 20px;
      font-weight: bold;
    }

    .tip {
      margin-top: 12px;
      color: #555;
      font-size: 16px;
    }

    .online-bar { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; color:#444; font-weight:bold; }
    .online-button, .online-close, .online-retry { border:2px solid #7f5539; border-radius:10px; background:#fff; color:#5d4037; padding:9px 14px; font:inherit; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #7f5539; }
    .online-button:active, .online-close:active, .online-retry:active { transform:translateY(2px); box-shadow:0 2px 0 #7f5539; }
    .upload-status { min-height:20px; color:#666; font-size:14px; }
    .online-modal { position:fixed; z-index:20; inset:0; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(255,245,201,.9); }
    .online-modal.is-visible { display:flex; }
    .online-panel { width:min(760px,96vw); max-height:90vh; overflow:auto; border:4px solid #7f5539; border-radius:18px; background:#fff; padding:20px; box-shadow:0 12px 30px rgba(0,0,0,.2); text-align:left; }
    .online-header { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:2px solid #7f5539; padding-bottom:12px; }
    .online-header h2 { margin:0; color:#ff6b6b; }
    .online-close { width:42px; height:42px; padding:0; font-size:24px; }
    .online-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:18px; }
    .online-section:first-child { grid-column:1/-1; }
    .online-section h3 { margin:0 0 8px; color:#5d4037; }
    .online-list { border-top:2px solid #7f5539; min-height:48px; }
    .online-row { display:grid; grid-template-columns:34px minmax(72px,1fr) auto auto; gap:8px; padding:9px 0; border-bottom:1px solid #ccc; color:#444; font-weight:bold; }
    .online-row span:nth-child(n+3) { text-align:right; }
    .online-message { color:#777; font-weight:bold; }
    .online-retry { display:none; margin-top:16px; }
    .online-retry.is-visible { display:inline-block; }
    @media (max-width:680px) { .online-grid { grid-template-columns:1fr; } .online-section:first-child { grid-column:auto; } .online-row { font-size:13px; } }
  </style>
</head>
<body>
  <div class="game-box">
    <h1>米宝的地洞惊喜游戏</h1>

    <div class="info-bar">
      <div>得分：<span id="score">0</span></div>
      <div>时间：<span id="time">60</span> 秒</div>
      <div id="status">状态：正常</div>
    </div>

    <div class="board">
      <div class="holes" id="holes"></div>
    </div>

    <div id="message" class="message">地鼠、炸弹、钻石都会随机冒出来。</div>
    <div class="tip">点到地鼠加 1 分，点到炸弹会暂停 5 秒，点到钻石加 5 分。</div>
    <div class="online-bar"><span>当前玩家：<strong id="familyPlayerDisplay">爸爸</strong></span><button id="leaderboardButton" class="online-button" type="button">在线排行榜</button><span id="uploadStatus" class="upload-status" role="status" aria-live="polite"></span></div>
  </div>

  <div id="leaderboardModal" class="online-modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle"><div class="online-panel">
    <div class="online-header"><h2 id="leaderboardTitle">在线排行榜</h2><button id="leaderboardClose" class="online-close" type="button" aria-label="关闭">×</button></div>
    <div class="online-grid">
      <section class="online-section"><h3>历史最高分 TOP 3</h3><div id="topScores" class="online-list"></div></section>
      <section class="online-section"><h3>最近 10 局</h3><div id="recentScores" class="online-list"></div></section>
      <section class="online-section"><h3 id="myScoresTitle">我的最近 10 局</h3><div id="myScores" class="online-list"></div></section>
    </div><button id="leaderboardRetry" class="online-retry" type="button">重新加载</button>
  </div></div>

  <script>
    const holes = document.getElementById("holes");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const statusText = document.getElementById("status");
    const messageText = document.getElementById("message");
    const familyPlayerDisplay = document.getElementById("familyPlayerDisplay");
    const uploadStatus = document.getElementById("uploadStatus");
    const leaderboardModal = document.getElementById("leaderboardModal");
    const leaderboardButton = document.getElementById("leaderboardButton");
    const leaderboardClose = document.getElementById("leaderboardClose");
    const leaderboardRetry = document.getElementById("leaderboardRetry");
    const topScores = document.getElementById("topScores");
    const recentScores = document.getElementById("recentScores");
    const myScores = document.getElementById("myScores");
    const myScoresTitle = document.getElementById("myScoresTitle");
    const SUPABASE_URL = "https://euvhugrohdejsjdehkze.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IoILNvOG-OvT6HhWILSpGw_0TJh81ue";
    const SCORE_API = `${SUPABASE_URL}/rest/v1/scores`;
    const GAME_ID = "mole_surprise_1min";
    const currentPlayer = loadFamilyPlayer();

    const itemTypes = [
      { name: "mole", emoji: "🐹", weight: 5 },
      { name: "bomb", emoji: "💣", weight: 2 },
      { name: "diamond", emoji: "💎", weight: 2 }
    ];

    const holeCount = 6;
    const showTime = 1200;
    const nextTime = 900;

    let score = 0;
    let timeLeft = 60;
    let gameOver = false;
    let paused = false;
    let activeHoleIndex = -1;
    let activeType = "";
    let roundTimer = null;
    let clockTimer = null;
    let pauseTimer = null;
    let scoreUploaded = false;
    const gameStartedAt = performance.now();

    function loadFamilyPlayer() { try { const player=localStorage.getItem("familyPlayer");const normalized=typeof player==="string"?player.trim():"";return normalized&&Array.from(normalized).length<=10?normalized:"爸爸"; } catch(error) { return "爸爸"; } }

    // 创建地洞
    for (let i = 0; i < holeCount; i = i + 1) {
      const hole = document.createElement("div");
      hole.className = "hole";

      const pit = document.createElement("div");
      pit.className = "pit";

      const item = document.createElement("button");
      item.className = "item";
      item.dataset.index = i;

      item.addEventListener("click", function () {
        hitItem(i);
      });

      hole.appendChild(item);
      hole.appendChild(pit);
      holes.appendChild(hole);
    }

    const itemButtons = document.querySelectorAll(".item");

    // 更新分数
    function updateScore() {
      scoreText.textContent = score;
    }

    // 更新时间
    function updateTime() {
      timeText.textContent = timeLeft;
    }

    // 显示提示文字
    function showMessage(text) {
      messageText.textContent = text;
    }

    // 随机挑一个类型
    function getRandomType() {
      let total = 0;

      for (const item of itemTypes) {
        total = total + item.weight;
      }

      let random = Math.random() * total;

      for (const item of itemTypes) {
        random = random - item.weight;

        if (random <= 0) {
          return item;
        }
      }

      return itemTypes[0];
    }

    // 随机挑一个地洞
    function getRandomHoleIndex() {
      return Math.floor(Math.random() * holeCount);
    }

    // 先把所有东西藏起来
    function hideAllItems() {
      itemButtons.forEach(function (button) {
        button.classList.remove("show");
        button.style.display = "none";
        button.textContent = "";
        button.dataset.type = "";
        button.disabled = true;
      });

      activeHoleIndex = -1;
      activeType = "";
    }

    // 随机显示一个东西
    function showRandomItem() {
      if (gameOver || paused) {
        return;
      }

      hideAllItems();

      const holeIndex = getRandomHoleIndex();
      const item = getRandomType();
      const button = itemButtons[holeIndex];

      activeHoleIndex = holeIndex;
      activeType = item.name;

      button.textContent = item.emoji;
      button.dataset.type = item.name;
      button.style.display = "block";
      button.disabled = false;

      setTimeout(function () {
        button.classList.add("show");
      }, 10);

      roundTimer = setTimeout(function () {
        hideAllItems();

        if (!gameOver && !paused) {
          roundTimer = setTimeout(showRandomItem, nextTime);
        }
      }, showTime);
    }

    // 点到了东西以后做不同处理
    function hitItem(index) {
      if (gameOver || paused || index !== activeHoleIndex) {
        return;
      }

      const button = itemButtons[index];
      const type = button.dataset.type;

      clearTimeout(roundTimer);
      hideAllItems();

      if (type === "mole") {
        score = score + 1;
        updateScore();
        showMessage("打到地鼠了，加 1 分。");
        roundTimer = setTimeout(showRandomItem, nextTime);
        return;
      }

      if (type === "diamond") {
        score = score + 5;
        updateScore();
        showMessage("太棒了，钻石加了 5 分。");
        roundTimer = setTimeout(showRandomItem, nextTime);
        return;
      }

      if (type === "bomb") {
        paused = true;
        statusText.textContent = "状态：暂停 5 秒";
        showMessage("哎呀，点到炸弹了，暂停 5 秒。");

        pauseTimer = setTimeout(function () {
          paused = false;
          statusText.textContent = "状态：正常";
          showMessage("游戏继续，加油。");

          if (!gameOver) {
            showRandomItem();
          }
        }, 5000);
      }
    }

    // 倒计时
    function startClock() {
      clockTimer = setInterval(function () {
        if (gameOver) {
          return;
        }

        timeLeft = timeLeft - 1;
        updateTime();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 游戏结束
    function endGame() {
      if (gameOver) return;
      gameOver = true;
      clearTimeout(roundTimer);
      clearTimeout(pauseTimer);
      clearInterval(clockTimer);
      hideAllItems();
      statusText.textContent = "状态：游戏结束";
      showMessage("时间到。你最后得了 " + score + " 分。");
      const duration = Math.max(0, Math.round((performance.now() - gameStartedAt) / 1000));
      uploadScore(score, duration);
    }

    async function uploadScore(finalScore, duration) {
      if(scoreUploaded)return; scoreUploaded=true; uploadStatus.textContent="正在上传成绩...";
      try { const response=await fetch(SCORE_API,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({game:GAME_ID,player:currentPlayer,score:finalScore,result:`1分钟获得 ${finalScore} 分`,duration})}); if(!response.ok)throw new Error(`Supabase INSERT failed: ${response.status}`); uploadStatus.textContent="成绩已上传"; }
      catch(error){console.warn("成绩上传失败",error);uploadStatus.textContent="成绩上传失败";}
    }
    async function fetchScores(order,limit,player="") { const query=new URLSearchParams({select:"player,score,duration,created_at",game:`eq.${GAME_ID}`,order,limit:String(limit)});if(player)query.set("player",`eq.${player}`);const response=await fetch(`${SCORE_API}?${query}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!response.ok)throw new Error(`Supabase SELECT failed: ${response.status}`);return response.json(); }
    function showListMessage(container,text){container.innerHTML="";const p=document.createElement("p");p.className="online-message";p.textContent=text;container.append(p);}
    function renderScores(container,records){container.innerHTML="";if(!records.length){showListMessage(container,"暂无成绩");return;}records.forEach((record,index)=>{const row=document.createElement("div");row.className="online-row";[`#${index+1}`,record.player||"未知玩家",`${Number(record.score)||0} 分`,`${Number(record.duration)||0} 秒`].forEach(value=>{const span=document.createElement("span");span.textContent=value;row.append(span);});container.append(row);});}
    async function loadLeaderboard(){leaderboardRetry.classList.remove("is-visible");[topScores,recentScores,myScores].forEach(el=>showListMessage(el,"加载中..."));const jobs=[fetchScores("score.desc,created_at.asc",3).then(r=>{renderScores(topScores,r);return true;}).catch(e=>{console.warn(e);showListMessage(topScores,"排行榜暂时无法加载");return false;}),fetchScores("created_at.desc",10).then(r=>{renderScores(recentScores,r);return true;}).catch(e=>{console.warn(e);showListMessage(recentScores,"排行榜暂时无法加载");return false;}),fetchScores("created_at.desc",10,currentPlayer).then(r=>{renderScores(myScores,r);return true;}).catch(e=>{console.warn(e);showListMessage(myScores,"排行榜暂时无法加载");return false;})];const results=await Promise.all(jobs);leaderboardRetry.classList.toggle("is-visible",results.includes(false));}

    updateScore();
    updateTime();
    showRandomItem();
    startClock();
    familyPlayerDisplay.textContent=currentPlayer;
    myScoresTitle.textContent=`${currentPlayer}的最近 10 局`;
    leaderboardButton.addEventListener("click",()=>{leaderboardModal.classList.add("is-visible");loadLeaderboard();});
    leaderboardClose.addEventListener("click",()=>leaderboardModal.classList.remove("is-visible"));
    leaderboardRetry.addEventListener("click",loadLeaderboard);
    leaderboardModal.addEventListener("click",event=>{if(event.target===leaderboardModal)leaderboardModal.classList.remove("is-visible");});
  </script>
</body>
</html>
