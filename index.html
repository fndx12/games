<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的游戏大厅</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --ink: #172033;
      --muted: #667085;
      --card: #ffffff;
      --line: #d9e0ea;
      --blue: #2f80ed;
      --green: #2fb66d;
      --yellow: #ffd66b;
      --shadow: 0 16px 38px rgba(23, 32, 51, 0.12);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 214, 107, 0.5), transparent 26%),
        radial-gradient(circle at 90% 14%, rgba(47, 128, 237, 0.16), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 55%, #edf7f0 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 15px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.7;
    }

    .count {
      min-width: 116px;
      padding: 14px 18px;
      border: 1px solid rgba(47, 128, 237, 0.22);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
      text-align: center;
      box-shadow: 0 10px 22px rgba(47, 128, 237, 0.08);
    }

    .count strong {
      display: block;
      color: var(--blue);
      font-size: 34px;
      line-height: 1;
    }

    .count span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .hero-tools {
      display: grid;
      grid-template-columns: minmax(150px, auto) 116px;
      gap: 12px;
      align-items: stretch;
    }

    .player-control {
      display: grid;
      gap: 7px;
      min-width: 150px;
      padding: 12px 14px;
      border: 1px solid rgba(47, 182, 109, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 22px rgba(47, 182, 109, 0.08);
    }

    .player-control label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .player-control select {
      width: 100%;
      min-height: 42px;
      padding: 7px 34px 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .player-select-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 8px;
      align-items: stretch;
    }

    .manage-players-button,
    .player-modal-close,
    .add-player-button,
    .delete-player-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .manage-players-button {
      width: 42px;
      min-height: 42px;
      color: var(--green);
      font-size: 24px;
      line-height: 1;
    }

    .manage-players-button:hover,
    .manage-players-button:focus-visible {
      border-color: rgba(47, 182, 109, 0.6);
      background: #f0fbf5;
      outline: none;
    }

    .player-control select:focus-visible {
      outline: 3px solid rgba(47, 128, 237, 0.24);
      outline-offset: 2px;
    }

    .game-section + .game-section {
      margin-top: 38px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .games {
      display: grid;
      gap: 18px;
    }

    .featured-games {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .other-games {
      grid-template-columns: repeat(auto-fit, minmax(205px, 1fr));
      gap: 14px;
    }

    .game-card {
      min-width: 0;
      min-height: 196px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .game-art {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(135deg, var(--accent-soft), rgba(255, 255, 255, 0.88));
      border-bottom: 1px solid rgba(217, 224, 234, 0.72);
    }

    .game-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.9);
      font-size: 36px;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.08);
    }

    .frequent-badge {
      align-self: flex-start;
      padding: 5px 9px;
      border: 1px solid rgba(23, 32, 51, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .game-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
    }

    .game-name {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .family-records {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.4;
    }

    .family-record {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .start-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      background: var(--ink);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      margin-top: auto;
    }

    .start-button:hover {
      transform: translateY(-2px);
      background: #26344d;
      box-shadow: 0 10px 22px rgba(23, 32, 51, 0.18);
    }

    .start-button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .featured-card {
      min-height: 286px;
      border-color: rgba(47, 128, 237, 0.2);
      box-shadow: 0 20px 44px rgba(23, 32, 51, 0.15);
    }

    .featured-card .game-art {
      min-height: 124px;
      padding: 24px;
    }

    .featured-card .game-icon {
      width: 76px;
      height: 76px;
      font-size: 44px;
    }

    .featured-card .game-body {
      gap: 14px;
      padding: 22px;
    }

    .featured-card .game-name {
      font-size: 24px;
    }

    .featured-card .start-button {
      min-height: 52px;
      background: #22304a;
      font-size: 17px;
    }

    .compact-card .game-art {
      min-height: 78px;
      padding: 15px;
    }

    .compact-card .game-icon {
      width: 52px;
      height: 52px;
      font-size: 30px;
    }

    .compact-card .game-body {
      padding: 15px;
    }

    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      text-align: center;
    }

    .player-modal {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(23, 32, 51, 0.42);
    }

    .player-modal.is-visible {
      display: flex;
    }

    .player-modal-panel {
      width: min(480px, 100%);
      max-height: min(680px, 90vh);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 24px 64px rgba(23, 32, 51, 0.24);
      padding: 22px;
    }

    .player-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .player-modal-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .player-modal-close {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      font-size: 22px;
    }

    .add-player-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 18px;
    }

    .add-player-form input {
      min-width: 0;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }

    .add-player-button {
      min-height: 46px;
      padding: 9px 16px;
      background: var(--ink);
      color: #ffffff;
    }

    .player-form-message {
      min-height: 21px;
      margin: 8px 0 0;
      color: #c23a3a;
      font-size: 14px;
      font-weight: 700;
    }

    .player-list {
      display: grid;
      gap: 9px;
      margin-top: 10px;
    }

    .player-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 9px 10px 9px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfe;
    }

    .player-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 800;
    }

    .default-player-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .delete-player-button {
      min-height: 38px;
      padding: 7px 11px;
      color: #b42318;
      border-color: rgba(180, 35, 24, 0.24);
      background: #fff8f7;
    }

    @media (max-width: 920px) {
      .featured-games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 22px, 520px);
        padding: 26px 0 32px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      .count {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        text-align: left;
      }

      .hero-tools {
        grid-template-columns: minmax(0, 1fr) minmax(110px, 0.7fr);
      }

      .player-control {
        min-width: 0;
      }

      .add-player-form {
        grid-template-columns: 1fr;
      }

      .add-player-button {
        width: 100%;
      }

      .count span {
        margin-top: 0;
      }

      .games {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .featured-card {
        min-height: 250px;
      }

      .game-section + .game-section {
        margin-top: 30px;
      }

      .section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="hall-title">
      <div>
        <p class="eyebrow">HTML Games</p>
        <h1 id="hall-title">我的游戏大厅</h1>
        <p class="subtitle">这里整理了当前项目里的 HTML 小游戏。点击卡片里的按钮，就可以直接开始玩。</p>
      </div>
      <div class="hero-tools">
        <div class="player-control">
          <label for="familyPlayerSelect">当前玩家</label>
          <div class="player-select-row">
            <select id="familyPlayerSelect" aria-label="当前玩家"></select>
            <button id="managePlayersButton" class="manage-players-button" type="button" aria-label="管理玩家" title="管理玩家">+</button>
          </div>
        </div>
        <div class="count" aria-label="游戏数量">
          <strong id="gameCount">0</strong>
          <span>个小游戏</span>
        </div>
      </div>
    </section>

    <section class="game-section" aria-labelledby="featured-title">
      <div class="section-heading">
        <h2 id="featured-title">常玩游戏</h2>
        <span>最近最常打开的游戏</span>
      </div>
      <div id="featuredGames" class="games featured-games"></div>
    </section>

    <section class="game-section" aria-labelledby="other-title">
      <div class="section-heading">
        <h2 id="other-title">其他游戏</h2>
        <span>更多家庭小游戏</span>
      </div>
      <div id="otherGames" class="games other-games"></div>
    </section>
  </main>

  <div id="playerModal" class="player-modal" role="dialog" aria-modal="true" aria-labelledby="playerModalTitle">
    <div class="player-modal-panel">
      <div class="player-modal-header">
        <h2 id="playerModalTitle">管理玩家</h2>
        <button id="playerModalClose" class="player-modal-close" type="button" aria-label="关闭玩家管理">×</button>
      </div>
      <form id="addPlayerForm" class="add-player-form" novalidate>
        <input id="newPlayerName" type="text" maxlength="10" autocomplete="off" placeholder="输入玩家名字" aria-label="新玩家名字">
        <button class="add-player-button" type="submit">新增玩家</button>
      </form>
      <p id="playerFormMessage" class="player-form-message" role="status" aria-live="polite"></p>
      <div id="playerList" class="player-list" aria-label="玩家列表"></div>
    </div>
  </div>

  <script>
    const games = [
      {
        id: "red-hat-bird",
        name: "红帽小子大冒险：飞鸟关",
        file: "red-hat-boy-game-bird-level.html",
        icon: "🪽",
        color: "rgba(47, 182, 109, 0.2)",
        featured: true,
        records: [{ game: "red_hat_bird_4_levels", direction: "asc", type: "time" }]
      },
      {
        id: "dino-runner",
        name: "恐龙跑酷游戏",
        file: "恐龙跑酷游戏.html",
        icon: "🦖",
        color: "rgba(126, 181, 67, 0.2)",
        featured: true,
        records: [{ game: "dino_runner", direction: "desc", type: "score" }]
      },
      {
        id: "warrior-cats",
        name: "猫武士：猫族营地物语",
        file: "猫武士.html",
        icon: "🐾",
        color: "rgba(38, 166, 154, 0.18)",
        featured: true,
        records: []
      },
      {
        id: "bunny-carrot",
        name: "米宝的小兔子吃胡萝卜",
        file: "mibao_bunny_carrot_game.html",
        icon: "🥕",
        color: "rgba(255, 214, 107, 0.5)",
        featured: false,
        records: [{ game: "bunny_carrot_1min", direction: "desc", type: "score" }]
      },
      {
        id: "money-race",
        name: "大家来抢钱",
        file: "大家来抢钱.html",
        icon: "💰",
        color: "rgba(47, 128, 237, 0.18)",
        featured: false,
        records: []
      },
      {
        id: "red-hat-classic",
        name: "红帽小子大冒险（普通3关版）",
        file: "red-hat-boy-game.html",
        icon: "🧢",
        color: "rgba(232, 85, 85, 0.18)",
        featured: false,
        records: [{ game: "red_hat_3_levels", direction: "asc", type: "time" }]
      },
      {
        id: "mole-surprise",
        name: "米宝的地洞惊喜游戏",
        file: "mibao_mole_bomb_diamond_game.html",
        icon: "💎",
        color: "rgba(142, 99, 255, 0.16)",
        featured: false,
        records: [{ game: "mole_surprise_1min", direction: "desc", type: "score" }]
      },
      {
        id: "math-challenge",
        name: "米宝口算大挑战",
        file: "米宝口算大挑战-单文件版.html",
        icon: "🧮",
        color: "rgba(245, 166, 35, 0.2)",
        featured: false,
        records: [
          { game: "math_challenge_1min", direction: "desc", type: "score", label: "1分钟" },
          { game: "math_challenge_2min", direction: "desc", type: "score", label: "2分钟" }
        ]
      },
      {
        id: "dragon-champion",
        name: "驯龙冠军",
        file: "驯龙冠军.html",
        icon: "🐉",
        color: "rgba(79, 139, 82, 0.22)",
        featured: false,
        records: []
      }
    ];

    const featuredGamesEl = document.getElementById("featuredGames");
    const otherGamesEl = document.getElementById("otherGames");
    const gameCountEl = document.getElementById("gameCount");
    const familyPlayerSelect = document.getElementById("familyPlayerSelect");
    const managePlayersButton = document.getElementById("managePlayersButton");
    const playerModal = document.getElementById("playerModal");
    const playerModalClose = document.getElementById("playerModalClose");
    const addPlayerForm = document.getElementById("addPlayerForm");
    const newPlayerName = document.getElementById("newPlayerName");
    const playerFormMessage = document.getElementById("playerFormMessage");
    const playerList = document.getElementById("playerList");
    const PLAYER_STORAGE_KEY = "familyPlayer";
    const CUSTOM_PLAYERS_STORAGE_KEY = "familyCustomPlayers";
    const DEFAULT_PLAYERS = ["爸爸", "米宝", "婠婠"];
    const SUPABASE_URL = "https://euvhugrohdejsjdehkze.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IoILNvOG-OvT6HhWILSpGw_0TJh81ue";
    const SCORE_API = `${SUPABASE_URL}/rest/v1/scores`;

    function normalizePlayerName(name) {
      return typeof name === "string" ? name.trim() : "";
    }

    function loadCustomPlayers() {
      try {
        const parsed = JSON.parse(localStorage.getItem(CUSTOM_PLAYERS_STORAGE_KEY) || "[]");
        if (!Array.isArray(parsed)) return [];
        return parsed.reduce((players, name) => {
          const normalized = normalizePlayerName(name);
          if (
            normalized &&
            Array.from(normalized).length <= 10 &&
            !DEFAULT_PLAYERS.includes(normalized) &&
            !players.includes(normalized)
          ) {
            players.push(normalized);
          }
          return players;
        }, []);
      } catch (error) {
        console.warn("无法读取自定义玩家", error);
        return [];
      }
    }

    let customPlayers = loadCustomPlayers();

    function allPlayers() {
      return [...DEFAULT_PLAYERS, ...customPlayers];
    }

    function saveCustomPlayers() {
      try {
        localStorage.setItem(CUSTOM_PLAYERS_STORAGE_KEY, JSON.stringify(customPlayers));
      } catch (error) {
        console.warn("无法保存自定义玩家", error);
      }
    }

    function saveCurrentPlayer(player) {
      const selected = allPlayers().includes(player) ? player : DEFAULT_PLAYERS[0];
      familyPlayerSelect.value = selected;
      try {
        localStorage.setItem(PLAYER_STORAGE_KEY, selected);
      } catch (error) {
        console.warn("无法保存玩家选择", error);
      }
      return selected;
    }

    function loadCurrentPlayer() {
      try {
        const saved = normalizePlayerName(localStorage.getItem(PLAYER_STORAGE_KEY));
        return allPlayers().includes(saved) ? saved : DEFAULT_PLAYERS[0];
      } catch (error) {
        return DEFAULT_PLAYERS[0];
      }
    }

    function renderPlayerSelect(preferredPlayer = loadCurrentPlayer()) {
      familyPlayerSelect.replaceChildren();
      allPlayers().forEach((player) => {
        const option = document.createElement("option");
        option.value = player;
        option.textContent = player;
        familyPlayerSelect.append(option);
      });
      saveCurrentPlayer(preferredPlayer);
    }

    function renderPlayerList() {
      playerList.replaceChildren();
      allPlayers().forEach((player) => {
        const row = document.createElement("div");
        row.className = "player-row";

        const name = document.createElement("span");
        name.className = "player-name";
        name.textContent = player;
        row.append(name);

        if (DEFAULT_PLAYERS.includes(player)) {
          const label = document.createElement("span");
          label.className = "default-player-label";
          label.textContent = "默认玩家";
          label.title = "默认玩家不能删除";
          row.append(label);
        } else {
          const button = document.createElement("button");
          button.className = "delete-player-button";
          button.type = "button";
          button.dataset.player = player;
          button.textContent = "删除";
          button.setAttribute("aria-label", `删除玩家${player}`);
          row.append(button);
        }
        playerList.append(row);
      });
    }

    function openPlayerModal() {
      playerFormMessage.textContent = "";
      newPlayerName.value = "";
      renderPlayerList();
      playerModal.classList.add("is-visible");
      newPlayerName.focus();
    }

    function closePlayerModal() {
      playerModal.classList.remove("is-visible");
      managePlayersButton.focus();
    }

    renderPlayerSelect();
    familyPlayerSelect.addEventListener("change", () => saveCurrentPlayer(familyPlayerSelect.value));
    managePlayersButton.addEventListener("click", openPlayerModal);
    playerModalClose.addEventListener("click", closePlayerModal);
    playerModal.addEventListener("click", (event) => {
      if (event.target === playerModal) closePlayerModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && playerModal.classList.contains("is-visible")) closePlayerModal();
    });

    addPlayerForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const player = normalizePlayerName(newPlayerName.value);
      if (!player) {
        playerFormMessage.textContent = "玩家名字不能为空";
        return;
      }
      if (Array.from(player).length > 10) {
        playerFormMessage.textContent = "玩家名字最多 10 个字符";
        return;
      }
      if (allPlayers().includes(player)) {
        playerFormMessage.textContent = "这个玩家已经存在";
        return;
      }

      customPlayers.push(player);
      saveCustomPlayers();
      renderPlayerSelect(player);
      renderPlayerList();
      newPlayerName.value = "";
      playerFormMessage.textContent = `已新增并切换到“${player}”`;
    });

    playerList.addEventListener("click", (event) => {
      const button = event.target.closest(".delete-player-button");
      if (!button) return;
      const player = button.dataset.player;
      if (!customPlayers.includes(player)) return;
      if (!window.confirm(`确定删除玩家“${player}”吗？`)) return;

      const wasCurrentPlayer = familyPlayerSelect.value === player;
      customPlayers = customPlayers.filter((name) => name !== player);
      saveCustomPlayers();
      renderPlayerSelect(wasCurrentPlayer ? DEFAULT_PLAYERS[0] : familyPlayerSelect.value);
      renderPlayerList();
      playerFormMessage.textContent = `已删除“${player}”，历史排行榜成绩仍会保留`;
    });

    function renderGameCard(game) {
      const recordMarkup = game.records.length
        ? `<div class="family-records" aria-live="polite">${game.records.map((record, index) =>
            `<div id="record-${game.id}-${index}" class="family-record">🏆 ${record.label ? `${record.label}：` : ""}家庭纪录加载中...</div>`
          ).join("")}</div>`
        : "";

      return `
        <article class="game-card ${game.featured ? "featured-card" : "compact-card"}" style="--accent-soft: ${game.color}">
          <div class="game-art" aria-hidden="true">
            <div class="game-icon">${game.icon}</div>
            ${game.featured ? '<span class="frequent-badge">常玩</span>' : ""}
          </div>
          <div class="game-body">
            <h3 class="game-name">${game.name}</h3>
            ${recordMarkup}
            <a class="start-button" href="${encodeURI(game.file)}">开始游戏</a>
          </div>
        </article>`;
    }

    function formatRunTime(score) {
      const total = Math.max(0, Number(score) || 0);
      const minutes = Math.floor(total / 6000);
      const seconds = Math.floor((total % 6000) / 100);
      const fraction = String(Math.floor(total % 100)).padStart(2, "0");
      return `${minutes}分${String(seconds).padStart(2, "0")}.${fraction}秒`;
    }

    function formatRecord(record, rule) {
      if (!record) return "暂无家庭纪录";
      if (rule.type === "time") {
        const readableTime = typeof record.result === "string" && record.result.includes("通关")
          ? record.result.replace(/^.*?通关\s*/, "")
          : formatRunTime(record.score);
        return `${record.player || "未知玩家"} · ${readableTime}`;
      }
      return `${record.player || "未知玩家"} · ${Number(record.score) || 0}分`;
    }

    function findBestRecord(records, rule) {
      return records.reduce((best, current) => {
        if (!best) return current;
        const currentScore = Number(current.score);
        const bestScore = Number(best.score);
        if (!Number.isFinite(currentScore)) return best;
        if (!Number.isFinite(bestScore)) return current;
        return rule.direction === "asc"
          ? (currentScore < bestScore ? current : best)
          : (currentScore > bestScore ? current : best);
      }, null);
    }

    async function loadFamilyRecords() {
      const recordGames = games.flatMap((game) => game.records.map((record) => record.game));
      const query = new URLSearchParams({
        select: "game,player,score,result,created_at",
        game: `in.(${recordGames.join(",")})`
      });

      try {
        const response = await fetch(`${SCORE_API}?${query}`, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        });
        if (!response.ok) throw new Error(`Supabase SELECT failed: ${response.status}`);
        const records = await response.json();

        games.forEach((game) => {
          game.records.forEach((rule, index) => {
            const matching = records.filter((record) => record.game === rule.game);
            const best = findBestRecord(matching, rule);
            const element = document.getElementById(`record-${game.id}-${index}`);
            if (element) element.textContent = `🏆 ${rule.label ? `${rule.label}：` : ""}${formatRecord(best, rule)}`;
          });
        });
      } catch (error) {
        console.warn("家庭纪录加载失败", error);
        document.querySelectorAll(".family-record").forEach((element) => {
          element.textContent = "🏆 家庭纪录暂时无法加载";
        });
      }
    }

    gameCountEl.textContent = games.length;
    featuredGamesEl.innerHTML = games.filter((game) => game.featured).map(renderGameCard).join("");
    otherGamesEl.innerHTML = games.filter((game) => !game.featured).map(renderGameCard).join("");
    loadFamilyRecords();
  </script>
</body>
</html>
