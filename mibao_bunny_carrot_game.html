<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>米宝的小兔子吃胡萝卜</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #bfefff 0%, #f7ffe0 100%);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .game-box {
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #ff6b6b;
      font-size: 34px;
    }

    .info-bar {
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 28px;
      color: #444;
      font-size: 24px;
      font-weight: bold;
    }

    #game {
      position: relative;
      width: 600px;
      height: 400px;
      border: 4px solid #7ac74f;
      border-radius: 18px;
      background: linear-gradient(180deg, #dff6ff 0%, #c8f7c5 65%, #a8e6a1 100%);
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .bunny,
    .carrot,
    .message {
      position: absolute;
    }

    .carrot {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      user-select: none;
    }

    .bunny {
      width: 64px;
      height: 72px;
      user-select: none;
    }

    .bunny-head {
      position: absolute;
      top: 0;
      left: 10px;
      font-size: 42px;
      line-height: 1;
    }

    .bunny-body {
      position: absolute;
      left: 18px;
      top: 36px;
      width: 28px;
      height: 24px;
      border-radius: 16px;
      background: #ffffff;
      border: 2px solid #f2c6de;
    }

    .bunny-feet {
      position: absolute;
      left: 20px;
      top: 58px;
      font-size: 16px;
      letter-spacing: 4px;
      color: #ff9eb5;
    }

    .message {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 22px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #ff6b6b;
      font-size: 28px;
      font-weight: bold;
      display: none;
    }

    .touch-dpad {
      position: absolute;
      z-index: 8;
      left: 14px;
      bottom: 14px;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 5px;
      align-items: center;
      justify-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    .dpad-button,
    .dpad-center {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
    }

    .dpad-button {
      border: 2px solid rgba(78, 143, 52, 0.68);
      background: rgba(255, 255, 255, 0.76);
      color: #3f7f2d;
      box-shadow: 0 4px 10px rgba(55, 103, 37, 0.2);
      font: inherit;
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .dpad-button.is-pressed,
    .dpad-button:active {
      transform: translateY(2px);
      background: rgba(255, 244, 174, 0.92);
      box-shadow: 0 2px 5px rgba(55, 103, 37, 0.2);
    }

    .dpad-center {
      background: rgba(122, 199, 79, 0.5);
      color: rgba(47, 102, 35, 0.82);
      font-size: 20px;
      pointer-events: none;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-center { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    .tip {
      margin-top: 12px;
      color: #555;
      font-size: 16px;
    }

    .online-bar { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; color:#444; font-weight:bold; }
    .online-button, .online-close, .online-retry { border:2px solid #7ac74f; border-radius:10px; background:#fff; color:#444; padding:9px 14px; font:inherit; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #7ac74f; }
    .online-button:active, .online-close:active, .online-retry:active { transform:translateY(2px); box-shadow:0 2px 0 #7ac74f; }
    .upload-status { min-height:20px; color:#666; font-size:14px; }
    .online-modal { position:fixed; z-index:20; inset:0; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(223,246,255,.88); }
    .online-modal.is-visible { display:flex; }
    .online-panel { width:min(760px, 96vw); max-height:90vh; overflow:auto; border:4px solid #7ac74f; border-radius:18px; background:#fff; padding:20px; box-shadow:0 12px 30px rgba(0,0,0,.2); text-align:left; }
    .online-header { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:2px solid #7ac74f; padding-bottom:12px; }
    .online-header h2 { margin:0; color:#ff6b6b; }
    .online-close { width:42px; height:42px; padding:0; font-size:24px; }
    .online-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:18px; }
    .online-section:first-child { grid-column:1/-1; }
    .online-section h3 { margin:0 0 8px; color:#444; }
    .online-list { border-top:2px solid #7ac74f; min-height:48px; }
    .online-row { display:grid; grid-template-columns:34px minmax(72px,1fr) auto auto; gap:8px; padding:9px 0; border-bottom:1px solid #ccc; color:#444; font-weight:bold; }
    .online-row span:nth-child(n+3) { text-align:right; }
    .online-message { color:#777; font-weight:bold; }
    .online-retry { display:none; margin-top:16px; }
    .online-retry.is-visible { display:inline-block; }
    @media (max-width:680px) { .online-grid { grid-template-columns:1fr; } .online-section:first-child { grid-column:auto; } .online-row { font-size:13px; } }
    @media (max-width:680px), (max-height:520px) {
      .touch-dpad {
        left: 9px;
        bottom: 9px;
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(3, 46px);
        gap: 4px;
      }
      .dpad-button,
      .dpad-center {
        width: 46px;
        height: 46px;
        border-radius: 14px;
      }
      .dpad-button { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="game-box">
    <h1>米宝的小兔子吃胡萝卜</h1>
    <div class="info-bar">
      <div>当前得分：<span id="score">0</span></div>
      <div>剩余时间：<span id="time">60</span> 秒</div>
    </div>

    <div id="game">
      <div id="bunny" class="bunny">
        <div class="bunny-head">🐰</div>
        <div class="bunny-body"></div>
        <div class="bunny-feet">● ●</div>
      </div>
      <div id="carrot" class="carrot">🥕</div>
      <div id="message" class="message"></div>
      <div id="touchDpad" class="touch-dpad" aria-label="触屏方向键">
        <button class="dpad-button dpad-up" type="button" data-direction="up" aria-label="向上移动">↑</button>
        <button class="dpad-button dpad-left" type="button" data-direction="left" aria-label="向左移动">←</button>
        <span class="dpad-center" aria-hidden="true">●</span>
        <button class="dpad-button dpad-right" type="button" data-direction="right" aria-label="向右移动">→</button>
        <button class="dpad-button dpad-down" type="button" data-direction="down" aria-label="向下移动">↓</button>
      </div>
    </div>

    <div class="tip">使用方向键、WASD 或屏幕方向键，帮助小兔子在 1 分钟内尽量多吃胡萝卜吧。</div>
    <div class="online-bar">
      <span>当前玩家：<strong id="familyPlayerDisplay">爸爸</strong></span>
      <button id="leaderboardButton" class="online-button" type="button">在线排行榜</button>
      <span id="uploadStatus" class="upload-status" role="status" aria-live="polite"></span>
    </div>
  </div>

  <div id="leaderboardModal" class="online-modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
    <div class="online-panel">
      <div class="online-header"><h2 id="leaderboardTitle">在线排行榜</h2><button id="leaderboardClose" class="online-close" type="button" aria-label="关闭">×</button></div>
      <div class="online-grid">
        <section class="online-section"><h3>历史最高分 TOP 3</h3><div id="topScores" class="online-list"></div></section>
        <section class="online-section"><h3>最近 10 局</h3><div id="recentScores" class="online-list"></div></section>
        <section class="online-section"><h3 id="myScoresTitle">我的最近 10 局</h3><div id="myScores" class="online-list"></div></section>
      </div>
      <button id="leaderboardRetry" class="online-retry" type="button">重新加载</button>
    </div>
  </div>

  <script>
    // 先找到页面上的元素
    const game = document.getElementById("game");
    const bunny = document.getElementById("bunny");
    const carrot = document.getElementById("carrot");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");
    const familyPlayerDisplay = document.getElementById("familyPlayerDisplay");
    const uploadStatus = document.getElementById("uploadStatus");
    const leaderboardModal = document.getElementById("leaderboardModal");
    const leaderboardButton = document.getElementById("leaderboardButton");
    const leaderboardClose = document.getElementById("leaderboardClose");
    const leaderboardRetry = document.getElementById("leaderboardRetry");
    const topScores = document.getElementById("topScores");
    const recentScores = document.getElementById("recentScores");
    const myScores = document.getElementById("myScores");
    const myScoresTitle = document.getElementById("myScoresTitle");
    const touchDpad = document.getElementById("touchDpad");
    const dpadButtons = Array.from(touchDpad.querySelectorAll(".dpad-button"));

    const SUPABASE_URL = "https://euvhugrohdejsjdehkze.supabase.co";
    const SUPABASE_KEY = "sb_publishable_IoILNvOG-OvT6HhWILSpGw_0TJh81ue";
    const SCORE_API = `${SUPABASE_URL}/rest/v1/scores`;
    const GAME_ID = "bunny_carrot_1min";
    const currentPlayer = loadFamilyPlayer();

    // 游戏区域大小
    const gameWidth = 600;
    const gameHeight = 400;

    // 角色大小
    const bunnyWidth = 64;
    const bunnyHeight = 72;
    const carrotSize = 48;

    // 小兔子的起始位置和速度
    const bunnyData = {
      x: 100,
      y: 100,
      speed: 10
    };

    let score = 0;
    let timeLeft = 60;
    let gameOver = false;
    let carrotTimer = null;
    let clockTimer = null;
    let touchMoveTimer = null;
    let activePointerId = null;
    let activeDpadButton = null;
    let scoreUploaded = false;
    const gameStartedAt = performance.now();

    function loadFamilyPlayer() {
      try {
        const player = localStorage.getItem("familyPlayer");
        const normalized = typeof player === "string" ? player.trim() : "";
        return normalized && Array.from(normalized).length <= 10 ? normalized : "爸爸";
      } catch (error) {
        return "爸爸";
      }
    }

    // 把小兔子画到新位置
    function drawBunny() {
      bunny.style.left = bunnyData.x + "px";
      bunny.style.top = bunnyData.y + "px";
    }

    // 让胡萝卜随机出现在游戏区域中
    function moveCarrot() {
      if (gameOver) {
        return;
      }

      const maxX = gameWidth - carrotSize;
      const maxY = gameHeight - carrotSize;

      const randomX = Math.floor(Math.random() * (maxX + 1));
      const randomY = Math.floor(Math.random() * (maxY + 1));

      carrot.style.left = randomX + "px";
      carrot.style.top = randomY + "px";
      carrot.style.display = "flex";
    }

    // 更新分数显示
    function updateScore() {
      scoreText.textContent = score;
    }

    // 更新剩余时间
    function updateTime() {
      timeText.textContent = timeLeft;
    }

    // 显示结束文字
    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    // 游戏结束时停止计时
    function endGame() {
      if (gameOver) return;
      gameOver = true;
      stopTouchMove();
      clearInterval(clockTimer);
      clearInterval(carrotTimer);
      carrot.style.display = "none";
      showMessage("时间到啦，你得了 " + score + " 分！");
      const duration = Math.max(0, Math.round((performance.now() - gameStartedAt) / 1000));
      uploadScore(score, duration);
    }

    async function uploadScore(finalScore, duration) {
      if (scoreUploaded) return;
      scoreUploaded = true;
      uploadStatus.textContent = "正在上传成绩...";
      try {
        const response = await fetch(SCORE_API, { method:"POST", headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json", Prefer:"return=minimal" }, body:JSON.stringify({ game:GAME_ID, player:currentPlayer, score:finalScore, result:`1分钟获得 ${finalScore} 分`, duration }) });
        if (!response.ok) throw new Error(`Supabase INSERT failed: ${response.status}`);
        uploadStatus.textContent = "成绩已上传";
      } catch (error) {
        console.warn("成绩上传失败", error);
        uploadStatus.textContent = "成绩上传失败";
      }
    }

    async function fetchScores(order, limit, player = "") {
      const query = new URLSearchParams({ select:"player,score,duration,created_at", game:`eq.${GAME_ID}`, order, limit:String(limit) });
      if (player) query.set("player", `eq.${player}`);
      const response = await fetch(`${SCORE_API}?${query}`, { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } });
      if (!response.ok) throw new Error(`Supabase SELECT failed: ${response.status}`);
      return response.json();
    }

    function showListMessage(container, text) { container.innerHTML = ""; const p=document.createElement("p"); p.className="online-message"; p.textContent=text; container.append(p); }
    function renderScores(container, records) {
      container.innerHTML = "";
      if (!records.length) { showListMessage(container, "暂无成绩"); return; }
      records.forEach((record,index) => { const row=document.createElement("div"); row.className="online-row"; [`#${index+1}`, record.player||"未知玩家", `${Number(record.score)||0} 分`, `${Number(record.duration)||0} 秒`].forEach(value => { const span=document.createElement("span"); span.textContent=value; row.append(span); }); container.append(row); });
    }
    async function loadLeaderboard() {
      leaderboardRetry.classList.remove("is-visible"); [topScores,recentScores,myScores].forEach(el => showListMessage(el,"加载中..."));
      const jobs = [
        fetchScores("score.desc,created_at.asc",3).then(r=>{renderScores(topScores,r);return true;}).catch(e=>{console.warn(e);showListMessage(topScores,"排行榜暂时无法加载");return false;}),
        fetchScores("created_at.desc",10).then(r=>{renderScores(recentScores,r);return true;}).catch(e=>{console.warn(e);showListMessage(recentScores,"排行榜暂时无法加载");return false;}),
        fetchScores("created_at.desc",10,currentPlayer).then(r=>{renderScores(myScores,r);return true;}).catch(e=>{console.warn(e);showListMessage(myScores,"排行榜暂时无法加载");return false;})
      ];
      const results=await Promise.all(jobs); leaderboardRetry.classList.toggle("is-visible",results.includes(false));
    }

    // 胡萝卜每 30 秒换一个新位置
    function startCarrotLoop() {
      carrotTimer = setInterval(function () {
        carrot.style.display = "none";

        setTimeout(function () {
          moveCarrot();
        }, 300);
      }, 30000);
    }

    // 开始一分钟倒计时
    function startClock() {
      clockTimer = setInterval(function () {
        timeLeft = timeLeft - 1;
        updateTime();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 检查小兔子有没有碰到胡萝卜
    function checkEatCarrot() {
      if (gameOver || carrot.style.display === "none") {
        return;
      }

      const bunnyLeft = bunnyData.x;
      const bunnyTop = bunnyData.y;
      const bunnyRight = bunnyLeft + bunnyWidth;
      const bunnyBottom = bunnyTop + bunnyHeight;

      const carrotLeft = carrot.offsetLeft;
      const carrotTop = carrot.offsetTop;
      const carrotRight = carrotLeft + carrotSize;
      const carrotBottom = carrotTop + carrotSize;

      const isTouching =
        bunnyRight > carrotLeft &&
        bunnyLeft < carrotRight &&
        bunnyBottom > carrotTop &&
        bunnyTop < carrotBottom;

      if (isTouching) {
        score = score + 1;
        updateScore();
        moveCarrot();
      }
    }

    // 键盘和触屏共用同一套移动、边界和碰撞规则。
    function moveBunny(direction) {
      if (gameOver || leaderboardModal.classList.contains("is-visible")) {
        return;
      }

      if (direction === "up") bunnyData.y -= bunnyData.speed;
      if (direction === "down") bunnyData.y += bunnyData.speed;
      if (direction === "left") bunnyData.x -= bunnyData.speed;
      if (direction === "right") bunnyData.x += bunnyData.speed;

      bunnyData.x = Math.max(0, Math.min(bunnyData.x, gameWidth - bunnyWidth));
      bunnyData.y = Math.max(0, Math.min(bunnyData.y, gameHeight - bunnyHeight));
      drawBunny();
      checkEatCarrot();
    }

    function stopTouchMove(pointerId = null) {
      if (pointerId !== null && activePointerId !== pointerId) return;
      if (touchMoveTimer) {
        clearInterval(touchMoveTimer);
        touchMoveTimer = null;
      }
      if (activeDpadButton) {
        activeDpadButton.classList.remove("is-pressed");
        activeDpadButton = null;
      }
      activePointerId = null;
    }

    function startTouchMove(event) {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      if (gameOver || leaderboardModal.classList.contains("is-visible")) return;

      stopTouchMove();
      const button = event.currentTarget;
      const direction = button.dataset.direction;
      activePointerId = event.pointerId;
      activeDpadButton = button;
      button.classList.add("is-pressed");
      if (button.setPointerCapture) button.setPointerCapture(event.pointerId);

      moveBunny(direction);
      touchMoveTimer = setInterval(() => moveBunny(direction), 60);
    }

    // 保留方向键，并增加 WASD；按住时由浏览器键盘重复事件持续移动。
    document.addEventListener("keydown", function (event) {
      if (leaderboardModal.classList.contains("is-visible")) return;
      const directionByCode = {
        ArrowUp: "up",
        KeyW: "up",
        ArrowDown: "down",
        KeyS: "down",
        ArrowLeft: "left",
        KeyA: "left",
        ArrowRight: "right",
        KeyD: "right"
      };
      const direction = directionByCode[event.code];
      if (!direction) return;
      event.preventDefault();
      moveBunny(direction);
    });

    dpadButtons.forEach((button) => {
      button.addEventListener("pointerdown", startTouchMove);
      button.addEventListener("pointerup", (event) => stopTouchMove(event.pointerId));
      button.addEventListener("pointercancel", (event) => stopTouchMove(event.pointerId));
      button.addEventListener("lostpointercapture", (event) => stopTouchMove(event.pointerId));
      button.addEventListener("contextmenu", (event) => event.preventDefault());
    });
    window.addEventListener("blur", () => stopTouchMove());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopTouchMove();
    });

    // 游戏开始时先显示一次
    drawBunny();
    moveCarrot();
    updateScore();
    updateTime();
    startClock();
    startCarrotLoop();
    familyPlayerDisplay.textContent = currentPlayer;
    myScoresTitle.textContent = `${currentPlayer}的最近 10 局`;
    leaderboardButton.addEventListener("click",()=>{stopTouchMove();leaderboardModal.classList.add("is-visible");loadLeaderboard();});
    leaderboardClose.addEventListener("click",()=>leaderboardModal.classList.remove("is-visible"));
    leaderboardRetry.addEventListener("click",loadLeaderboard);
    leaderboardModal.addEventListener("click",event=>{if(event.target===leaderboardModal)leaderboardModal.classList.remove("is-visible");});
  </script>
</body>
</html>
