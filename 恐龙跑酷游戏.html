<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>恐龙跑酷游戏</title>
  <style>
:root {
  --ink: #111;
  --paper: #f7f7f7;
  --muted: #5f5f5f;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--paper);
}

body {
  color: var(--ink);
  font-family: "Courier New", "PingFang SC", "Microsoft YaHei", monospace;
  user-select: none;
  touch-action: none;
}

.game-shell {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background:
    linear-gradient(#fefefe 0 67%, #efefef 67% 100%);
}

#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #fafafa;
}

.hud {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  left: max(22px, env(safe-area-inset-left));
  right: max(22px, env(safe-area-inset-right));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  pointer-events: none;
  font-weight: 800;
  letter-spacing: 0;
}

.title {
  font-size: clamp(18px, 2.2vw, 28px);
}

.counter {
  min-width: 180px;
  text-align: right;
  font-size: clamp(18px, 2vw, 26px);
}

.overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(247, 247, 247, 0.42);
  pointer-events: none;
}

.overlay.is-visible {
  display: flex;
}

.overlay-panel {
  width: min(560px, 88vw);
  border: 4px solid var(--ink);
  background: rgba(250, 250, 250, 0.92);
  box-shadow: 8px 8px 0 var(--ink);
  padding: 28px 30px;
  text-align: center;
}

.overlay-panel h1 {
  margin: 0 0 14px;
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.1;
}

.overlay-panel p {
  margin: 10px 0 0;
  font-size: clamp(17px, 2vw, 22px);
  font-weight: 700;
}

.overlay-panel .hint {
  color: var(--muted);
  font-size: clamp(14px, 1.6vw, 18px);
}

.start-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 22px auto 0;
  pointer-events: auto;
}

.start-button,
.revive-button {
  min-height: 58px;
  border: 4px solid var(--ink);
  border-radius: 0;
  background: #fafafa;
  color: var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  font: inherit;
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 900;
  cursor: pointer;
  pointer-events: auto;
}

.start-button {
  width: 100%;
  box-shadow: 5px 5px 0 var(--ink);
  white-space: nowrap;
}

.start-button:active {
  transform: translate(2px, 2px);
  box-shadow: 3px 3px 0 var(--ink);
}

.revive-button {
  display: none;
  width: min(320px, 76vw);
  margin: 22px auto 0;
  box-shadow: 6px 6px 0 var(--ink);
}

.revive-button.is-visible {
  display: block;
}

.revive-button:active {
  transform: translate(3px, 3px);
  box-shadow: 3px 3px 0 var(--ink);
}

.player-picker {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 18px 0 0;
  font-size: 16px;
  font-weight: 900;
  pointer-events: auto;
}

.leaderboard-button,
.modal-close,
.retry-button {
  border: 3px solid var(--ink);
  border-radius: 0;
  background: #fafafa;
  color: var(--ink);
  font: inherit;
  font-weight: 900;
  cursor: pointer;
}

.player-display {
  min-width: 110px;
  border-bottom: 3px solid var(--ink);
  padding: 5px 10px;
  text-align: left;
}

.leaderboard-button {
  position: fixed;
  z-index: 4;
  left: max(18px, env(safe-area-inset-left));
  bottom: max(18px, env(safe-area-inset-bottom));
  min-height: 44px;
  padding: 8px 14px;
  box-shadow: 4px 4px 0 var(--ink);
}

.leaderboard-button:active,
.modal-close:active,
.retry-button:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--ink);
}

.score-status {
  min-height: 20px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
}

.leaderboard-modal {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(247, 247, 247, 0.88);
  touch-action: pan-y;
}

.leaderboard-modal.is-visible {
  display: flex;
}

.leaderboard-panel {
  width: min(760px, 96vw);
  max-height: min(760px, 92vh);
  overflow: auto;
  border: 4px solid var(--ink);
  background: #fafafa;
  box-shadow: 8px 8px 0 var(--ink);
  padding: 20px;
  text-align: left;
}

.leaderboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 3px solid var(--ink);
  padding-bottom: 12px;
}

.leaderboard-header h2 {
  margin: 0;
  font-size: clamp(24px, 4vw, 34px);
}

.modal-close {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  font-size: 24px;
  box-shadow: 3px 3px 0 var(--ink);
}

.leaderboard-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
  margin-top: 18px;
}

.score-section:first-child {
  grid-column: 1 / -1;
}

.score-section h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.score-list {
  min-height: 54px;
  border-top: 2px solid var(--ink);
}

.score-row {
  display: grid;
  grid-template-columns: 36px minmax(80px, 1fr) auto auto;
  gap: 8px;
  align-items: center;
  min-height: 38px;
  border-bottom: 1px solid #aaa;
  font-size: 14px;
  font-weight: 800;
}

.score-row span:nth-child(3),
.score-row span:nth-child(4) {
  text-align: right;
}

.list-message {
  margin: 14px 0;
  color: var(--muted);
  font-size: 14px;
  font-weight: 800;
}

.retry-button {
  display: none;
  margin-top: 16px;
  min-height: 40px;
  padding: 6px 12px;
  box-shadow: 3px 3px 0 var(--ink);
}

.retry-button.is-visible {
  display: inline-block;
}

@media (max-width: 680px) {
  .overlay-panel {
    padding: 22px 18px;
  }

  .start-options {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .leaderboard-grid {
    grid-template-columns: 1fr;
  }

  .score-section:first-child {
    grid-column: auto;
  }

  .score-row {
    grid-template-columns: 28px minmax(70px, 1fr) auto auto;
    font-size: 12px;
  }
}

@media (orientation: portrait) {
  .game-shell::after {
    content: "建议横屏游玩";
    position: fixed;
    right: 18px;
    bottom: max(18px, env(safe-area-inset-bottom));
    border: 3px solid var(--ink);
    background: #fafafa;
    padding: 10px 12px;
    font-size: 16px;
    font-weight: 800;
  }
}

  </style>
</head>
<body>
  <main class="game-shell" aria-label="恐龙跑酷游戏">
    <canvas id="gameCanvas" aria-label="恐龙跑酷游戏画面"></canvas>
    <div class="hud" aria-hidden="true">
      <div class="title">恐龙跑酷游戏</div>
      <div id="avoidCounter" class="counter">躲避障碍：0</div>
    </div>
    <div id="overlay" class="overlay is-visible">
      <div class="overlay-panel">
        <h1>恐龙跑酷游戏</h1>
        <p id="overlayText">选择起始难度</p>
        <p class="player-picker">当前玩家：<span id="playerDisplay" class="player-display">爸爸</span></p>
        <div id="startOptions" class="start-options">
          <button class="start-button" type="button" data-start="0">普通</button>
          <button class="start-button" type="button" data-start="30">30分</button>
          <button class="start-button" type="button" data-start="50">50分</button>
          <button class="start-button" type="button" data-start="70">70分</button>
        </div>
        <button id="reviveButton" class="revive-button" type="button">复活</button>
        <div id="scoreStatus" class="score-status" role="status" aria-live="polite"></div>
        <p class="hint">游戏中：点击/空格跳跃　下滑/↓低头</p>
      </div>
    </div>
    <button id="leaderboardButton" class="leaderboard-button" type="button">排行榜</button>
    <div id="leaderboardModal" class="leaderboard-modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
      <div class="leaderboard-panel">
        <div class="leaderboard-header">
          <h2 id="leaderboardTitle">在线排行榜</h2>
          <button id="leaderboardClose" class="modal-close" type="button" aria-label="关闭排行榜">×</button>
        </div>
        <div class="leaderboard-grid">
          <section class="score-section">
            <h3>历史最高分 TOP 3</h3>
            <div id="topScores" class="score-list"></div>
          </section>
          <section class="score-section">
            <h3>最近 10 局</h3>
            <div id="recentScores" class="score-list"></div>
          </section>
          <section class="score-section">
            <h3 id="myScoresTitle">我的最近 10 局</h3>
            <div id="myScores" class="score-list"></div>
          </section>
        </div>
        <button id="retryLeaderboard" class="retry-button" type="button">重新加载</button>
      </div>
    </div>
  </main>
  <script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const counterEl = document.getElementById("avoidCounter");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlayText");
const startOptions = document.getElementById("startOptions");
const reviveButton = document.getElementById("reviveButton");
const playerDisplay = document.getElementById("playerDisplay");
const scoreStatus = document.getElementById("scoreStatus");
const leaderboardButton = document.getElementById("leaderboardButton");
const leaderboardModal = document.getElementById("leaderboardModal");
const leaderboardClose = document.getElementById("leaderboardClose");
const retryLeaderboard = document.getElementById("retryLeaderboard");
const topScores = document.getElementById("topScores");
const recentScores = document.getElementById("recentScores");
const myScores = document.getElementById("myScores");
const myScoresTitle = document.getElementById("myScoresTitle");

const SUPABASE_URL = "https://euvhugrohdejsjdehkze.supabase.co";
const SUPABASE_KEY = "sb_publishable_IoILNvOG-OvT6HhWILSpGw_0TJh81ue";
const SCORE_API = `${SUPABASE_URL}/rest/v1/scores`;
const GAME_ID = "dino_runner";
const PLAYER_STORAGE_KEY = "familyPlayer";

const DPR_LIMIT = 2;
const GAME = {
  ready: "ready",
  running: "running",
  paused: "paused",
  over: "over"
};

let state = GAME.ready;
let width = 0;
let height = 0;
let scale = 1;
let groundY = 0;
let lastTime = 0;
let touchStart = null;
let selectedStartAvoided = 0;
let scoreUploaded = false;
let currentPlayer = loadPlayer();
let leaderboardPausedGame = false;

const world = {
  elapsed: 0,
  speed: 440,
  spawnTimer: 1,
  spawnGap: 1.35,
  groundOffset: 0,
  cloudOffset: 0,
  startElapsed: 0,
  startAvoided: 0,
  avoided: 0,
  obstacles: [],
  clouds: []
};

const dino = {
  x: 0,
  y: 0,
  baseY: 0,
  w: 54,
  h: 72,
  duckH: 44,
  vy: 0,
  grounded: true,
  ducking: false,
  runFrame: 0,
  jumpCooldown: 0
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);
  width = Math.max(640, window.innerWidth);
  height = Math.max(360, window.innerHeight);
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = Math.min(width / 1024, height / 650);
  groundY = Math.round(height * 0.72);
  dino.w = Math.round(54 * scale);
  dino.h = Math.round(72 * scale);
  dino.duckH = Math.round(44 * scale);
  dino.x = Math.round(width * 0.15);
  dino.baseY = groundY - dino.h;
  if (dino.grounded) {
    dino.y = dino.baseY;
  }
}

function getStartElapsed(avoided) {
  return avoided * 1.25;
}

function resetGame(startAvoided = selectedStartAvoided) {
  scoreUploaded = false;
  scoreStatus.textContent = "";
  world.elapsed = 0;
  world.startAvoided = startAvoided;
  world.startElapsed = getStartElapsed(startAvoided);
  const startDifficulty = getDifficulty();
  world.speed = (440 + 240 * startDifficulty) * scale;
  world.spawnTimer = 0.95;
  world.spawnGap = 1.35 - 0.55 * startDifficulty;
  world.groundOffset = 0;
  world.cloudOffset = 0;
  world.avoided = startAvoided;
  world.obstacles = [];
  world.clouds = createClouds();

  dino.y = dino.baseY;
  dino.vy = 0;
  dino.grounded = true;
  dino.ducking = false;
  dino.runFrame = 0;
  dino.jumpCooldown = 0;

  state = GAME.running;
  overlay.classList.remove("is-visible");
  startOptions.style.display = "none";
  reviveButton.classList.remove("is-visible");
  updateCounter();
}

function showStartOptions() {
  state = GAME.ready;
  touchStart = null;
  dino.ducking = false;
  overlayText.textContent = "选择起始难度";
  overlay.classList.add("is-visible");
  startOptions.style.display = "grid";
  reviveButton.classList.remove("is-visible");
}

function getDifficulty() {
  return Math.min(1, (world.elapsed + world.startElapsed) / 95);
}

function createClouds() {
  return Array.from({ length: 5 }, (_, index) => ({
    x: (width / 5) * index + 80,
    y: 70 + ((index * 47) % 90),
    w: 72 + (index % 2) * 28,
    speed: 18 + index * 5
  }));
}

function jump() {
  if (state !== GAME.running) {
    return;
  }
  if (!dino.grounded || dino.jumpCooldown > 0) {
    return;
  }
  dino.ducking = false;
  dino.vy = -840 * scale;
  dino.grounded = false;
  dino.jumpCooldown = 0.08;
}

function setDuck(isDucking) {
  if (state !== GAME.running || !dino.grounded) {
    dino.ducking = false;
    return;
  }
  dino.ducking = isDucking;
}

function onPointerDown(event) {
  event.preventDefault();
  if (state !== GAME.running) {
    return;
  }
  touchStart = {
    x: event.clientX,
    y: event.clientY,
    time: performance.now()
  };
}

function onPointerMove(event) {
  if (!touchStart || state !== GAME.running) {
    return;
  }
  const dy = event.clientY - touchStart.y;
  const dx = Math.abs(event.clientX - touchStart.x);
  if (dy > 34 && dy > dx * 1.2) {
    setDuck(true);
  }
}

function onPointerUp(event) {
  event.preventDefault();
  if (!touchStart) {
    return;
  }
  const dy = event.clientY - touchStart.y;
  const dx = Math.abs(event.clientX - touchStart.x);
  const duration = performance.now() - touchStart.time;
  const isTap = Math.abs(dy) < 24 && dx < 24 && duration < 420;
  touchStart = null;

  if (state === GAME.running) {
    if (isTap) {
      jump();
    }
    setDuck(false);
  }
}

function onKeyDown(event) {
  if (leaderboardModal.classList.contains("is-visible")) {
    if (event.code === "Escape") {
      closeLeaderboard();
    }
    if (event.code === "Space" || event.code === "ArrowDown") {
      event.preventDefault();
    }
    return;
  }
  if (event.code === "Space") {
    event.preventDefault();
    jump();
  }
  if (event.code === "ArrowDown") {
    event.preventDefault();
    setDuck(true);
  }
}

function onKeyUp(event) {
  if (event.code === "ArrowDown") {
    event.preventDefault();
    setDuck(false);
  }
}

function spawnObstacle() {
  const progressElapsed = world.elapsed + world.startElapsed;
  const birdChance = Math.min(0.47, 0.22 + progressElapsed / 75);
  const type = Math.random() < birdChance ? "bird" : "spike";
  const baseSpeed = world.speed * (type === "bird" ? 1.04 : 1);

  if (type === "spike") {
    const size = Math.round((46 + Math.random() * 12) * scale);
    world.obstacles.push({
      type,
      x: width + size,
      y: groundY - size,
      w: size,
      h: size,
      speed: baseSpeed,
      counted: false,
      phase: 0
    });
  } else {
    const birdW = Math.round(68 * scale);
    const birdH = Math.round(38 * scale);
    world.obstacles.push({
      type,
      x: width + birdW,
      y: groundY - dino.h - Math.round(12 * scale),
      w: birdW,
      h: birdH,
      speed: baseSpeed,
      counted: false,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function update(dt) {
  if (state !== GAME.running) {
    return;
  }

  world.elapsed += dt;
  const difficulty = getDifficulty();
  world.speed = (440 + 240 * difficulty) * scale;
  world.spawnGap = 1.35 - 0.55 * difficulty;
  world.spawnTimer -= dt;
  world.groundOffset = (world.groundOffset + world.speed * dt) % (42 * scale);
  world.cloudOffset += dt;

  if (world.spawnTimer <= 0) {
    spawnObstacle();
    const jitter = 0.76 + Math.random() * 0.58;
    world.spawnTimer = world.spawnGap * jitter;
  }

  dino.jumpCooldown = Math.max(0, dino.jumpCooldown - dt);
  dino.runFrame += dt * (9 + difficulty * 4);

  if (!dino.grounded) {
    dino.vy += 2300 * scale * dt;
    dino.y += dino.vy * dt;
    if (dino.y >= dino.baseY) {
      dino.y = dino.baseY;
      dino.vy = 0;
      dino.grounded = true;
    }
  }

  for (const obstacle of world.obstacles) {
    obstacle.x -= obstacle.speed * dt;
    obstacle.phase += dt * 10;
    if (!obstacle.counted && obstacle.x + obstacle.w < dino.x) {
      obstacle.counted = true;
      world.avoided += 1;
      updateCounter();
    }
  }

  world.obstacles = world.obstacles.filter((obstacle) => obstacle.x + obstacle.w > -80);

  for (const cloud of world.clouds) {
    cloud.x -= cloud.speed * dt;
    if (cloud.x + cloud.w < -20) {
      cloud.x = width + 80 + Math.random() * 220;
      cloud.y = 58 + Math.random() * 115;
    }
  }

  const dinoBox = getDinoBox();
  for (const obstacle of world.obstacles) {
    if (rectsOverlap(dinoBox, getObstacleBox(obstacle))) {
      gameOver();
      break;
    }
  }
}

function updateCounter() {
  counterEl.textContent = `躲避障碍：${world.avoided}`;
}

function gameOver() {
  if (state !== GAME.running) {
    return;
  }
  state = GAME.over;
  const finalScore = world.avoided;
  const duration = Math.max(0, Math.floor(world.elapsed));
  overlayText.textContent = `Game Over　本局躲避障碍：${finalScore}`;
  overlay.classList.add("is-visible");
  reviveButton.classList.add("is-visible");
  uploadScore(finalScore, duration);
}

function loadPlayer() {
  try {
    const savedPlayer = localStorage.getItem(PLAYER_STORAGE_KEY);
    const normalized = typeof savedPlayer === "string" ? savedPlayer.trim() : "";
    return normalized && Array.from(normalized).length <= 10 ? normalized : "爸爸";
  } catch (error) {
    return "爸爸";
  }
}

function displayCurrentPlayer() {
  playerDisplay.textContent = currentPlayer;
  myScoresTitle.textContent = `${currentPlayer}的最近 10 局`;
}

async function uploadScore(finalScore, duration) {
  if (scoreUploaded) {
    return;
  }
  scoreUploaded = true;
  const playerAtGameOver = currentPlayer;
  scoreStatus.textContent = "正在上传成绩…";

  try {
    const response = await fetch(SCORE_API, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({
        game: GAME_ID,
        player: playerAtGameOver,
        score: finalScore,
        result: `躲过 ${finalScore} 个障碍`,
        duration
      })
    });

    if (!response.ok) {
      throw new Error(`Supabase INSERT failed: ${response.status}`);
    }
    scoreStatus.textContent = "成绩已上传";
  } catch (error) {
    console.warn("成绩上传失败", error);
    scoreStatus.textContent = "成绩上传失败";
  }
}

async function fetchScores({ order, limit, player = "" }) {
  const query = new URLSearchParams({
    select: "player,score,duration,created_at",
    game: `eq.${GAME_ID}`,
    order,
    limit: String(limit)
  });
  if (player) {
    query.set("player", `eq.${player}`);
  }

  const response = await fetch(`${SCORE_API}?${query}`, {
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`
    }
  });
  if (!response.ok) {
    throw new Error(`Supabase SELECT failed: ${response.status}`);
  }
  return response.json();
}

function showListMessage(container, message) {
  container.replaceChildren();
  const text = document.createElement("p");
  text.className = "list-message";
  text.textContent = message;
  container.append(text);
}

function renderScores(container, scores) {
  container.replaceChildren();
  if (!scores.length) {
    showListMessage(container, "暂无成绩");
    return;
  }

  scores.forEach((record, index) => {
    const row = document.createElement("div");
    row.className = "score-row";
    const values = [
      `#${index + 1}`,
      record.player || "未知玩家",
      `${Number(record.score) || 0} 分`,
      `${Number(record.duration) || 0} 秒`
    ];
    values.forEach((value) => {
      const cell = document.createElement("span");
      cell.textContent = value;
      row.append(cell);
    });
    container.append(row);
  });
}

async function loadLeaderboard() {
  retryLeaderboard.classList.remove("is-visible");
  showListMessage(topScores, "加载中…");
  showListMessage(recentScores, "加载中…");
  showListMessage(myScores, "加载中…");

  const requests = [
    fetchScores({ order: "score.desc,created_at.asc", limit: 3 })
      .then((scores) => { renderScores(topScores, scores); return true; })
      .catch((error) => { console.warn("最高分加载失败", error); showListMessage(topScores, "排行榜暂时无法加载"); return false; }),
    fetchScores({ order: "created_at.desc", limit: 10 })
      .then((scores) => { renderScores(recentScores, scores); return true; })
      .catch((error) => { console.warn("最近成绩加载失败", error); showListMessage(recentScores, "排行榜暂时无法加载"); return false; }),
    fetchScores({ order: "created_at.desc", limit: 10, player: currentPlayer })
      .then((scores) => { renderScores(myScores, scores); return true; })
      .catch((error) => { console.warn("玩家成绩加载失败", error); showListMessage(myScores, "排行榜暂时无法加载"); return false; })
  ];

  const results = await Promise.all(requests);
  retryLeaderboard.classList.toggle("is-visible", results.includes(false));
}

function openLeaderboard() {
  leaderboardPausedGame = state === GAME.running;
  if (leaderboardPausedGame) {
    state = GAME.paused;
  }
  leaderboardModal.classList.add("is-visible");
  touchStart = null;
  setDuck(false);
  loadLeaderboard();
  leaderboardClose.focus();
}

function closeLeaderboard() {
  leaderboardModal.classList.remove("is-visible");
  if (leaderboardPausedGame && state === GAME.paused) {
    state = GAME.running;
  }
  leaderboardPausedGame = false;
  leaderboardButton.focus();
}

function getDinoBox() {
  const duckOffset = dino.ducking ? dino.h - dino.duckH : 0;
  const boxH = dino.ducking ? dino.duckH : dino.h;
  const boxW = dino.ducking ? dino.w * 1.18 : dino.w * 0.82;
  return {
    x: dino.x + dino.w * 0.1,
    y: dino.y + duckOffset + dino.h * 0.08,
    w: boxW,
    h: boxH * 0.82
  };
}

function getObstacleBox(obstacle) {
  if (obstacle.type === "spike") {
    return {
      x: obstacle.x + obstacle.w * 0.18,
      y: obstacle.y + obstacle.h * 0.16,
      w: obstacle.w * 0.64,
      h: obstacle.h * 0.78
    };
  }
  return {
    x: obstacle.x + obstacle.w * 0.12,
    y: obstacle.y + obstacle.h * 0.2,
    w: obstacle.w * 0.76,
    h: obstacle.h * 0.58
  };
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  drawSky();
  drawGround();
  drawDino();
  for (const obstacle of world.obstacles) {
    if (obstacle.type === "spike") {
      drawSpike(obstacle);
    } else {
      drawBird(obstacle);
    }
  }
}

function drawSky() {
  ctx.fillStyle = "#fafafa";
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = "#111";
  ctx.lineWidth = Math.max(2, 3 * scale);

  for (const cloud of world.clouds) {
    drawCloud(cloud.x, cloud.y, cloud.w);
  }
}

function drawCloud(x, y, w) {
  const h = w * 0.34;
  ctx.save();
  ctx.lineWidth = Math.max(2, 3 * scale);
  ctx.strokeStyle = "#111";
  ctx.beginPath();
  ctx.moveTo(x, y + h * 0.72);
  ctx.lineTo(x + w * 0.18, y + h * 0.72);
  ctx.quadraticCurveTo(x + w * 0.22, y + h * 0.22, x + w * 0.43, y + h * 0.38);
  ctx.quadraticCurveTo(x + w * 0.56, y - h * 0.1, x + w * 0.72, y + h * 0.38);
  ctx.quadraticCurveTo(x + w * 0.94, y + h * 0.34, x + w, y + h * 0.72);
  ctx.lineTo(x + w * 1.16, y + h * 0.72);
  ctx.stroke();
  ctx.restore();
}

function drawGround() {
  ctx.strokeStyle = "#111";
  ctx.lineWidth = Math.max(3, 4 * scale);
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(width, groundY);
  ctx.stroke();
}

function drawDino() {
  const px = Math.max(2, Math.round(4 * scale));
  const legFrame = Math.floor(dino.runFrame) % 2;
  const duck = dino.ducking && dino.grounded;
  const x = Math.round(dino.x);
  const y = Math.round(dino.y + (duck ? dino.h - dino.duckH : 0));

  ctx.fillStyle = "#111";

  if (duck) {
    block(x + 2 * px, y + 5 * px, 12 * px, 6 * px);
    block(x + 12 * px, y + 2 * px, 12 * px, 7 * px);
    block(x + 21 * px, y + 4 * px, 8 * px, 5 * px);
    block(x + 25 * px, y + 2 * px, 2 * px, 2 * px);
    block(x, y + 7 * px, 5 * px, 2 * px);
    block(x + 7 * px, y + 11 * px, 4 * px, 3 * px);
    block(x + 17 * px, y + 10 * px, 4 * px, 4 * px);
    block(x + (legFrame ? 8 : 17) * px, y + 14 * px, 3 * px, 3 * px);
    return;
  }

  const jumpLift = dino.grounded ? 0 : Math.sin(performance.now() / 110) * px;
  const yy = y + jumpLift;
  block(x + 6 * px, yy + 7 * px, 9 * px, 12 * px);
  block(x + 12 * px, yy + 2 * px, 9 * px, 8 * px);
  block(x + 19 * px, yy + 4 * px, 5 * px, 3 * px);
  block(x + 19 * px, yy + 1 * px, 2 * px, 2 * px);
  block(x + 2 * px, yy + 10 * px, 5 * px, 3 * px);
  block(x, yy + 8 * px, 3 * px, 2 * px);
  block(x + 10 * px, yy + 14 * px, 4 * px, 4 * px);
  block(x + 5 * px, yy + 18 * px, 4 * px, 4 * px);
  block(x + 13 * px, yy + 18 * px, 4 * px, 4 * px);

  if (dino.grounded) {
    block(x + (legFrame ? 4 : 13) * px, yy + 21 * px, 3 * px, 3 * px);
    block(x + (legFrame ? 14 : 5) * px, yy + 21 * px, 3 * px, 3 * px);
  } else {
    block(x + 5 * px, yy + 21 * px, 3 * px, 2 * px);
    block(x + 14 * px, yy + 21 * px, 3 * px, 2 * px);
  }
}

function drawSpike(obstacle) {
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.moveTo(obstacle.x, obstacle.y + obstacle.h);
  ctx.lineTo(obstacle.x + obstacle.w * 0.5, obstacle.y);
  ctx.lineTo(obstacle.x + obstacle.w, obstacle.y + obstacle.h);
  ctx.closePath();
  ctx.fill();

  ctx.fillRect(obstacle.x - obstacle.w * 0.08, obstacle.y + obstacle.h - 4 * scale, obstacle.w * 1.16, 4 * scale);
}

function drawBird(obstacle) {
  const flap = Math.sin(obstacle.phase) > 0 ? -1 : 1;
  const x = obstacle.x;
  const y = obstacle.y;
  const w = obstacle.w;
  const h = obstacle.h;

  ctx.fillStyle = "#111";
  block(x + w * 0.36, y + h * 0.36, w * 0.32, h * 0.24);
  block(x + w * 0.64, y + h * 0.3, w * 0.18, h * 0.18);
  block(x + w * 0.78, y + h * 0.34, w * 0.08, h * 0.08);
  block(x + w * 0.7, y + h * 0.32, Math.max(2, 3 * scale), Math.max(2, 3 * scale));

  ctx.beginPath();
  if (flap < 0) {
    ctx.moveTo(x + w * 0.45, y + h * 0.42);
    ctx.lineTo(x + w * 0.08, y + h * 0.02);
    ctx.lineTo(x + w * 0.36, y + h * 0.55);
  } else {
    ctx.moveTo(x + w * 0.45, y + h * 0.5);
    ctx.lineTo(x + w * 0.12, y + h * 0.94);
    ctx.lineTo(x + w * 0.38, y + h * 0.44);
  }
  ctx.closePath();
  ctx.fill();
}

function block(x, y, w, h) {
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function loop(timestamp) {
  if (!lastTime) {
    lastTime = timestamp;
  }
  const dt = Math.min(0.033, (timestamp - lastTime) / 1000);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("resize", resize);
window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);
canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
canvas.addEventListener("pointermove", onPointerMove, { passive: false });
canvas.addEventListener("pointerup", onPointerUp, { passive: false });
canvas.addEventListener("pointercancel", () => {
  touchStart = null;
  setDuck(false);
});
reviveButton.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  if (state === GAME.over) {
    showStartOptions();
  }
});
startOptions.addEventListener("click", (event) => {
  const button = event.target.closest(".start-button");
  if (!button || state !== GAME.ready) {
    return;
  }
  event.preventDefault();
  event.stopPropagation();
  selectedStartAvoided = Number(button.dataset.start) || 0;
  resetGame(selectedStartAvoided);
});
leaderboardButton.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  openLeaderboard();
});
leaderboardClose.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  closeLeaderboard();
});
retryLeaderboard.addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  loadLeaderboard();
});
leaderboardModal.addEventListener("click", (event) => {
  if (event.target === leaderboardModal) {
    closeLeaderboard();
  }
});

resize();
world.clouds = createClouds();
updateCounter();
displayCurrentPlayer();
requestAnimationFrame(loop);

  </script>
